<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0f1115">
<title>InflowMap</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --font-sans:'Inter','Noto Sans Bengali',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-full:9999px;
    --sh-sm:0 1px 2px rgba(0,0,0,.05);
    --sh-md:0 2px 8px rgba(0,0,0,.06);
    --sh-lg:0 8px 24px rgba(0,0,0,.10);
    --dur-fast:120ms; --dur:180ms; --dur-slow:260ms;
    --ease:cubic-bezier(.4,0,.2,1);
    --touch:44px;
  }
  html[data-theme="light"]{
    --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f1f3f6; --surface-3:#e8ebf0;
    --border:#e3e6ec; --border-strong:#d3d8e0;
    --text:#14181f; --text-2:#566072; --text-3:#8b93a3;
    --primary:#3b5bdb; --primary-soft:#e8ecfb; --primary-contrast:#ffffff;
    --accent:#0ea5a4; --accent-soft:#e0f5f4;
    --success:#109c67; --success-soft:#e3f5ec;
    --danger:#d6455b; --danger-soft:#fbe9ec;
    --warn:#b7791f; --warn-soft:#fdf3e3;
    --shadow:var(--sh-md);
  }
  html[data-theme="dark"]{
    --bg:#0d0f14; --surface:#151922; --surface-2:#1b202b; --surface-3:#232a37;
    --border:#242c3a; --border-strong:#323c4d;
    --text:#eef1f7; --text-2:#9aa4b8; --text-3:#6b7688;
    --primary:#6b8afd; --primary-soft:#1c2540; --primary-contrast:#0d0f14;
    --accent:#2dd4bf; --accent-soft:#123a37;
    --success:#34d399; --success-soft:#12312a;
    --danger:#f87171; --danger-soft:#3a1a1e;
    --warn:#fbbf24; --warn-soft:#3a2f12;
    --shadow:0 2px 10px rgba(0,0,0,.4);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; }
  html{ overflow-x:hidden; overscroll-behavior-y:none; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body{
    font-family:var(--font-sans); background:var(--bg); color:var(--text);
    font-size:15px; line-height:1.5; overflow-x:hidden; overscroll-behavior-y:none;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    touch-action:pan-y; position:relative;
  }
  /* prevent layout shift / accidental zoom on interactive chrome */
  button, .chip, .nav-btn, .menu-item, .check, .grip{ user-select:none; -webkit-user-select:none; }
  input, select, textarea{ font-size:16px; } /* >=16px stops iOS auto-zoom on focus */
  img, svg{ max-width:100%; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  input,select,textarea{ font-family:inherit; font-size:16px; color:inherit; }
  :focus-visible{ outline:2px solid var(--primary); outline-offset:2px; border-radius:4px; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  .bn{ font-family:'Noto Sans Bengali','Inter',sans-serif; }

  /* Layout */
  #app{ max-width:640px; margin:0 auto; min-height:100dvh; background:var(--bg);
        padding-bottom:calc(72px + env(safe-area-inset-bottom)); position:relative;
        overflow-x:hidden; }
  body.sheet-open{ overflow:hidden; position:fixed; inset:0; width:100%; }
  @media(min-width:900px){
    body{ background:var(--bg); }
    #app{ max-width:760px; box-shadow:0 0 0 1px var(--border); }
  }
  .screen{ animation:fade var(--dur) var(--ease); }
  @keyframes fade{ from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none} }

  /* Components */
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); }
  .btn{ min-height:var(--touch); padding:0 18px; border-radius:var(--r-md); font-weight:600;
        font-size:14px; display:inline-flex; align-items:center; justify-content:center; gap:8px;
        transition:background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease), opacity var(--dur-fast); }
  .btn:active:not(:disabled){ transform:scale(.97); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-primary{ background:var(--primary); color:var(--primary-contrast); }
  .btn-primary:hover:not(:disabled){ filter:brightness(1.06); }
  .btn-ghost{ background:var(--surface-2); color:var(--text); }
  .btn-ghost:hover:not(:disabled){ background:var(--surface-3); }
  .btn-outline{ background:transparent; border:1px solid var(--border-strong); color:var(--text); }
  .btn-danger{ background:var(--danger-soft); color:var(--danger); }
  .btn-sm{ min-height:36px; padding:0 12px; font-size:13px; border-radius:var(--r-sm); }
  .btn-icon{ min-height:var(--touch); width:var(--touch); padding:0; border-radius:var(--r-md); }

  .input{ width:100%; min-height:var(--touch); padding:10px 14px; background:var(--surface-2); font-size:16px;
          border:1px solid var(--border); border-radius:var(--r-md); transition:border-color var(--dur-fast), background var(--dur-fast); }
  .input:focus{ outline:none; border-color:var(--primary); background:var(--surface); }
  textarea.input{ min-height:88px; resize:vertical; line-height:1.55; }
  .label{ font-size:12px; font-weight:600; color:var(--text-2); margin-bottom:6px; display:block; letter-spacing:.01em; }

  .chip{ display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:var(--r-full);
         font-size:13px; font-weight:500; background:var(--surface-2); color:var(--text-2); border:1px solid transparent;
         white-space:nowrap; flex:0 0 auto; }
  .chip[aria-pressed="true"], .chip.active{ background:var(--primary-soft); color:var(--primary); border-color:var(--primary); }
  .tag{ font-size:11px; padding:3px 9px; border-radius:var(--r-full); font-weight:600; white-space:nowrap; }
  .t-soft{ background:var(--surface-3); color:var(--text-2); }
  .t-primary{ background:var(--primary-soft); color:var(--primary); }
  .t-success{ background:var(--success-soft); color:var(--success); }
  .t-danger{ background:var(--danger-soft); color:var(--danger); }

  .divider{ height:1px; background:var(--border); border:0; margin:0; }
  .muted{ color:var(--text-2); } .muted2{ color:var(--text-3); }

  /* Progress */
  .bar{ height:8px; background:var(--surface-3); border-radius:var(--r-full); overflow:hidden; }
  .bar > i{ display:block; height:100%; background:var(--primary); border-radius:var(--r-full);
            transition:width var(--dur-slow) var(--ease); }
  .bar.success > i{ background:var(--success); }

  /* Bottom nav */
  .nav{ position:fixed; bottom:0; left:0; right:0; z-index:40; background:color-mix(in srgb, var(--surface) 92%, transparent);
        backdrop-filter:blur(12px); border-top:1px solid var(--border);
        padding-bottom:env(safe-area-inset-bottom); }
  .nav-inner{ max-width:640px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); }
  @media(min-width:900px){ .nav-inner{ max-width:760px; } }
  .nav-btn{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
            min-height:60px; color:var(--text-3); font-size:11px; font-weight:500; position:relative;
            transition:color var(--dur-fast); }
  .nav-btn.active{ color:var(--primary); }
  .nav-btn svg{ width:22px; height:22px; }
  .nav-btn.active::after{ content:''; position:absolute; top:0; width:24px; height:2px; border-radius:0 0 2px 2px; background:var(--primary); }

  /* Sheet / modal */
  .scrim{ position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; animation:fade var(--dur) var(--ease); }
  .sheet{ position:fixed; left:0; right:0; bottom:0; z-index:51; background:var(--surface);
          border-radius:var(--r-xl) var(--r-xl) 0 0; max-width:640px; margin:0 auto;
          max-height:88dvh; display:flex; flex-direction:column; animation:up var(--dur-slow) var(--ease);
          padding-bottom:env(safe-area-inset-bottom); }
  @media(min-width:900px){ .sheet{ max-width:760px; } }
  @keyframes up{ from{transform:translateY(100%)} to{transform:none} }
  .sheet-head{ padding:14px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
  .sheet-body{ padding:16px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .sheet-grab{ width:36px; height:4px; border-radius:2px; background:var(--border-strong); margin:8px auto 0; }

  .menu-item{ display:flex; align-items:center; gap:12px; width:100%; min-height:50px; padding:0 8px;
              border-radius:var(--r-md); font-size:15px; font-weight:500; text-align:left; transition:background var(--dur-fast); }
  .menu-item:hover{ background:var(--surface-2); }
  .menu-item.danger{ color:var(--danger); }

  /* Task row */
  .task{ display:flex; align-items:flex-start; gap:12px; padding:10px 6px; border-radius:var(--r-md);
         transition:background var(--dur-fast); position:relative; }
  .task:hover{ background:var(--surface-2); }
  .task.dragging{ opacity:.5; }
  .task.drop-target{ box-shadow:inset 0 2px 0 var(--primary); }
  .check{ width:24px; height:24px; flex:0 0 24px; border-radius:var(--r-full); border:2px solid var(--border-strong);
          display:flex; align-items:center; justify-content:center; transition:all var(--dur) var(--ease); margin-top:1px; }
  .check svg{ width:14px; height:14px; opacity:0; transform:scale(.6); transition:all var(--dur) var(--ease); }
  .task.done .check{ background:var(--success); border-color:var(--success); }
  .task.done .check svg{ opacity:1; transform:scale(1); color:#fff; }
  .task.done .task-title{ color:var(--text-3); text-decoration:line-through; }
  .task-title{ font-size:15px; line-height:1.45; word-break:break-word; }
  .task.completing{ animation:pulse var(--dur-slow) var(--ease); }
  @keyframes pulse{ 0%{background:var(--success-soft)} 100%{background:transparent} }

  .grip{ color:var(--text-3); opacity:.6; cursor:grab; touch-action:none; padding:2px; }
  .grip:active{ cursor:grabbing; }

  .day-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
             transition:box-shadow var(--dur) var(--ease), border-color var(--dur); }
  .day-card.today{ border-color:var(--primary); box-shadow:0 0 0 1px var(--primary); }
  .day-card.complete{ background:var(--surface-2); }
  .day-head{ display:flex; align-items:center; gap:12px; padding:14px 16px; }
  .day-body{ padding:0 16px 14px; animation:slide var(--dur) var(--ease); }
  @keyframes slide{ from{opacity:0; max-height:0} to{opacity:1; max-height:2000px} }

  .subject-block{ margin-bottom:10px; }
  .subject-name{ font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-2); margin:10px 6px 2px; }

  .empty{ text-align:center; padding:56px 24px; }
  .empty h3{ font-size:17px; font-weight:600; margin:0 0 6px; }
  .empty p{ color:var(--text-2); font-size:14px; margin:0 0 20px; }

  .toast-wrap{ position:fixed; bottom:calc(76px + env(safe-area-inset-bottom)); left:0; right:0; z-index:60;
               display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; padding:0 16px; }
  .toast{ background:var(--surface-3); color:var(--text); border:1px solid var(--border-strong);
          padding:10px 16px; border-radius:var(--r-md); font-size:14px; box-shadow:var(--shadow);
          animation:tin var(--dur) var(--ease); max-width:420px; pointer-events:auto; }
  @keyframes tin{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }

  .diff-add{ background:var(--success-soft); border-left:3px solid var(--success); padding:6px 10px; border-radius:6px; }
  .diff-del{ background:var(--danger-soft); border-left:3px solid var(--danger); padding:6px 10px; border-radius:6px; text-decoration:line-through; }
  .diff-mod{ background:var(--warn-soft); border-left:3px solid var(--warn); padding:6px 10px; border-radius:6px; }

  .skeleton{ background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 50%,var(--surface-2) 75%);
             background-size:200% 100%; animation:sh 1.2s infinite; border-radius:var(--r-sm); }
  @keyframes sh{ 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .scroll-x{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
  .scroll-x::-webkit-scrollbar{ display:none; }
  .rte-toolbar{ display:flex; gap:4px; flex-wrap:wrap; padding:8px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); z-index:1; }
  .rte-btn{ min-width:36px; height:36px; border-radius:var(--r-sm); display:flex; align-items:center; justify-content:center;
            font-size:14px; font-weight:600; color:var(--text-2); }
  .rte-btn:hover{ background:var(--surface-2); color:var(--text); }
  .rte{ min-height:240px; padding:16px; outline:none; font-size:15px; line-height:1.65; }
  .rte:empty:before{ content:attr(data-placeholder); color:var(--text-3); }
  .rte h1{ font-size:22px; font-weight:700; margin:14px 0 8px; }
  .rte h2{ font-size:18px; font-weight:600; margin:12px 0 6px; }
  .rte ul,.rte ol{ padding-left:22px; margin:8px 0; }
  .rte li{ margin:3px 0; }
  .rte a{ color:var(--primary); }
  .rte-blocker{ position:fixed; inset:0; z-index:70; background:transparent; }
</style>
</head>
<body>
<div id="app" role="application" aria-label="InflowMap study planner"></div>
<div id="layers" aria-live="polite"></div>
<div class="toast-wrap" id="toasts" aria-live="polite"></div>
<noscript>InflowMap requires JavaScript.</noscript>

<script>
"use strict";
/* =========================================================================
   InflowMap — architecture
   layers:  DB (IndexedDB) → Store (canonical state + subscribe) → Commands
            (validated mutations) → UI (render functions) ⇄ Screens
   AI:      Agent → AIService → ProviderAdapter(Gemini) → Tools(validated)
   ========================================================================= */
const IM = { version:"1.0.0", schemaVersion:1 };

/* ---------- utils ---------- */
const uid = (p="id") => p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const $ = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp = (n,a,b) => Math.max(a,Math.min(b,n));
const pct = (n,d) => d > 0 ? Math.round(n/d*100) : 0;

function isoDate(d){ const x=new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
function parseISO(s){ const [y,m,d]=String(s).split("-").map(Number); return new Date(y,(m||1)-1,d||1); }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return isoDate(d); }
function daysBetween(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
function todayISO(){ return isoDate(new Date()); }
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(s){ const d=parseISO(s); return d.getDate()+" "+MONTHS[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():""); }
function fmtDateLong(s){ const d=parseISO(s); return d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear(); }
function fmtTime(ts){ const d=new Date(ts); let h=d.getHours(), m=String(d.getMinutes()).padStart(2,"0"); const ap=h>=12?"PM":"AM"; h=h%12||12; return h+":"+m+" "+ap; }
function fmtDur(mins){ if(mins<60) return mins+" min"; const h=Math.floor(mins/60), m=mins%60; return m? h+"h "+m+"m" : h+"h"; }
function debounce(fn,ms=250){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
function greeting(){ const h=new Date().getHours(); return h<12?"Good morning":h<17?"Good afternoon":h<21?"Good evening":"Good night"; }

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){ const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(_){} ta.remove(); return true; }
}

/* ---------- icons (inline svg, consistent stroke system) ---------- */
const IC = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
  routine:'<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="2" cy="6" r=".6"/><circle cx="2" cy="12" r=".6"/><circle cx="2" cy="18" r=".6"/>',
  sparkle:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><path d="M6.3 6.3l2.8 2.8M14.9 14.9l2.8 2.8M17.7 6.3l-2.8 2.8M9.1 14.9l-2.8 2.8"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  play:'<path d="M6 4l14 8-14 8z"/>',
  pause:'<path d="M7 4v16M17 4v16"/>',
  timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>',
  note:'<path d="M4 4h11l5 5v11H4z"/><path d="M15 4v5h5M8 13h8M8 17h5"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-2.9 1.17V21a2 2 0 1 1-4 0v-.1a1.65 1.65 0 0 0-2.9-1.17l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 3 15H3a2 2 0 1 1 0-4h.1a1.65 1.65 0 0 0 1.17-2.9l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6V4a2 2 0 1 1 4 0v.1a1.65 1.65 0 0 0 2.9 1.17l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 21 11h.1a2 2 0 1 1 0 4z"/>',
  back:'<path d="M15 18l-6-6 6-6"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  move:'<path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/>',
  calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  chevron:'<path d="M6 9l6 6 6-6"/>',
  chevronR:'<path d="M9 6l6 6-6 6"/>',
  flame:'<path d="M12 2c1 4-3 5-3 9a3 3 0 0 0 6 0c0-1-.5-2-.5-2 2 1 3.5 3 3.5 5a6 6 0 1 1-12 0c0-5 6-7 6-12z"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',
  download:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',
  upload:'<path d="M12 21V9M7 14l5-5 5 5M4 3h16"/>',
  book:'<path d="M4 4h7a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H4z"/><path d="M20 4h-5a3 3 0 0 0-3 3v13a3 3 0 0 1 3-3h5z"/>',
  template:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>',
  refresh:'<path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>',

<script id="db-layer" type="application/javascript">
/* ============================ DB LAYER (IndexedDB) ============================ */
const DB = (() => {
  const NAME="inflowmap", VER=1;
  let db=null;
  const STORES = {
    settings:{ keyPath:"id" },
    routines:{ keyPath:"id", indexes:[["isPrimary","isPrimary"],["status","status"]] },
    days:{ keyPath:"id", indexes:[["routineId","routineId"],["routine_day",["routineId","dayNumber"],{unique:true}]] },
    subjects:{ keyPath:"id", indexes:[["name","name"]] },
    tasks:{ keyPath:"id", indexes:[["dayId","dayId"],["subjectId","subjectId"]] },
    notes:{ keyPath:"id", indexes:[["updatedAt","updatedAt"]] },
    sessions:{ keyPath:"id", indexes:[["taskId","taskId"],["startedAt","startedAt"]] },
    templates:{ keyPath:"id" },
    aichanges:{ keyPath:"id", indexes:[["createdAt","createdAt"]] }
  };

  function open(){
    return new Promise((res,rej)=>{
      const rq = indexedDB.open(NAME, VER);
      rq.onupgradeneeded = e => {
        const d = e.target.result;
        for(const [name,def] of Object.entries(STORES)){
          let st;
          if(!d.objectStoreNames.contains(name)){
            st = d.createObjectStore(name,{ keyPath:def.keyPath });
          } else st = e.target.transaction.objectStore(name);
          (def.indexes||[]).forEach(ix=>{
            const [iname,keyPath,opts] = ix;
            if(!st.indexNames.contains(iname)) st.createIndex(iname,keyPath,opts||{});
          });
        }
      };
      rq.onsuccess = () => { db=rq.result; res(db); };
      rq.onerror = () => rej(rq.error);
    });
  }
  const tx = (store,mode="readonly") => db.transaction(store,mode).objectStore(store);
  const wrap = rq => new Promise((res,rej)=>{ rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); });
  const req = (store,mode,fn) => { const r = fn(tx(store,mode)); return wrap(r); };

  return {
    open,
    async getAll(store,query,count){ return wrap(tx(store).getAll(query,count)); },
    async get(store,key){ return wrap(tx(store).get(key)); },
    async put(store,val){ return wrap(tx(store,"readwrite").put(val)); },
    async del(store,key){ return wrap(tx(store,"readwrite").delete(key)); },
    async bulkPut(store,vals){ const s=tx(store,"readwrite"); vals.forEach(v=>s.put(v)); return wrap(s.transaction.objectStore(store).count()===undefined?{ok:1}:tx(store).count()); },
    async clear(store){ return wrap(tx(store,"readwrite").clear()); },
    async getAllByIndex(store,index,query){ return wrap(tx(store).index(index).getAll(query)); },
    async count(store){ return wrap(tx(store).count()); },
    /* atomic multi-store transaction: fn receives {get,put,del} helpers */
    async txn(storeNames, mode, fn){
      return new Promise((res,rej)=>{
        const t = db.transaction(storeNames, mode);
        const api = {
          get:(s,k)=>wrap(t.objectStore(s).get(k)),
          put:(s,v)=>wrap(t.objectStore(s).put(v)),
          del:(s,k)=>wrap(t.objectStore(s).delete(k)),
          clear:(s)=>wrap(t.objectStore(s).clear()),
          getAll:(s)=>wrap(t.objectStore(s).getAll())
        };
        Promise.resolve(fn(api)).then(()=>{ t.oncomplete=()=>res(true); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); })
          .catch(err=>{ try{t.abort();}catch(_){ } rej(err); });
      });
    }
  };
})();

/* ============================ STORE (canonical state) ============================ */
const Store = (() => {
  let state = {
    ready:false,
    settings:{ id:"app", theme:"system", primaryRoutineId:null, ai:{ provider:"groq", apiKey:"", model:"openai/gpt-oss-120b" } },
    routines:[], days:[], subjects:[], tasks:[], notes:[], sessions:[], templates:[], aichanges:[],
    ui:{ screen:"home", routineView:"all", focusDayId:null, editingTaskId:null, aiContext:null, searchQuery:"", aiRoutineDraft:null }
  };
  const subs = new Set();
  const emit = () => subs.forEach(f=>{ try{f(state);}catch(e){ console.error(e); } });
  return {
    get s(){ return state; },
    subscribe(fn){ subs.add(fn); return ()=>subs.delete(fn); },
    emit,
    async load(){
      const [settings,routines,days,subjects,tasks,notes,sessions,templates,aichanges] = await Promise.all([
        DB.get("settings","app"), DB.getAll("routines"), DB.getAll("days"), DB.getAll("subjects"),
        DB.getAll("tasks"), DB.getAll("notes"), DB.getAll("sessions"), DB.getAll("templates"), DB.getAll("aichanges")
      ]);
      state.settings = Object.assign(state.settings, settings||{});
      if(!state.settings.ai) state.settings.ai = { provider:"groq", apiKey:"", model:"openai/gpt-oss-120b" };
      /* migrate legacy free-text model ids to the current default for the chosen provider */
      const LEGACY = ["gemini-2.5-flash","gemini-2.5-pro","gemini-2.5-flash-lite","gemini-1.5-flash","gemini-1.5-pro"];
      if(!state.settings.ai.model || LEGACY.includes(state.settings.ai.model)){
        state.settings.ai.model = (AIProviders[state.settings.ai.provider]||AIProviders.groq).defaultModel;
        await DB.put("settings", state.settings);
      }
      /* one-time: default provider moved to Groq; if no key was ever saved, follow the new default */
      if(!state.settings.ai.apiKey && !state.settings.ai.__provChosen){
        state.settings.ai.provider = "groq";
        state.settings.ai.model = AIProviders.groq.defaultModel;
        state.settings.ai.__provChosen = true;
        await DB.put("settings", state.settings);
      }
      state.routines=routines||[]; state.days=days||[]; state.subjects=subjects||[];
      state.tasks=tasks||[]; state.notes=notes||[]; state.sessions=sessions||[];
      state.templates=templates||[]; state.aichanges=(aichanges||[]).sort((a,b)=>b.createdAt-a.createdAt);
      state.ready = true;
      if(state.settings.theme) applyTheme(state.settings.theme);
      emit();
    },
    saveSettings: async (patch) => { state.settings=Object.assign({},state.settings,patch);
      if(state.settings.ai) state.settings.ai.__provChosen = true;
      await DB.put("settings",state.settings); emit(); },
    /* -- selectors -- */
    primaryRoutine(){ return state.routines.find(r=>r.isPrimary) || state.routines[0] || null; },
    routine(id){ return state.routines.find(r=>r.id===id) || null; },
    daysOf(routineId){ return state.days.filter(d=>d.routineId===routineId).sort((a,b)=>a.dayNumber-b.dayNumber); },
    day(id){ return state.days.find(d=>d.id===id) || null; },
    dayOfNumber(routineId,n){ return state.days.find(d=>d.routineId===routineId && d.dayNumber===n) || null; },
    tasksOf(dayId){ return state.tasks.filter(t=>t.dayId===dayId).sort((a,b)=>(a.sortOrder-b.sortOrder)||(a.createdAt-b.createdAt)); },
    dayIndex(routine,d){ const i = daysBetween(r.startDate, d.date); return i; },
    subject(id){ return state.subjects.find(s=>s.id===id) || null; },
    subjectName(id){ const s=state.subjects.find(x=>x.id===id); return s? s.name : "—"; },
    /* stats */
    statsFor(routineId){
      const days = state.days.filter(d=>d.routineId===routineId);
      const ids = new Set(days.map(d=>d.id));
      const tasks = state.tasks.filter(t=>ids.has(t.dayId));
      const done = tasks.filter(t=>t.completed).length;
      const doneDays = days.filter(d=>{ const dt=state.tasks.filter(t=>t.dayId===d.id); return dt.length>0 && dt.every(t=>t.completed); }).length;
      return { totalDays:days.length, doneDays, totalTasks:tasks.length, doneTasks:done, pct:pct(done,tasks.length) };
    },
    subjectStats(routineId){
      const days = state.days.filter(d=>d.routineId===routineId);
      const ids = new Set(days.map(d=>d.id));
      const map = new Map();
      state.tasks.filter(t=>ids.has(t.dayId)).forEach(t=>{
        const k = t.subjectId||"none";
        if(!map.has(k)) map.set(k,{ subjectId:k, name:(state.subjects.find(s=>s.id===k)||{}).name || "—", total:0, done:0, minutes:0 });
        const e = map.get(k); e.total++; if(t.completed) e.done++; e.minutes += t.estimatedMinutes||0;
      });
      return Array.from(map.values()).map(e=>({ ...e, pct:pct(e.done,e.total) })).sort((a,b)=>b.total-a.total);
    },
    sessionsOfTask(taskId){ return state.sessions.filter(s=>s.taskId===taskId); },
    activeSession(){ return state.sessions.find(s=>!s.endedAt && s.duration>0) || state.sessions.find(s=>!s.endedAt) || null; },
    streak(routineId){
      const days = state.days.filter(d=>d.routineId===routineId).sort((a,b)=>a.dayNumber-b.dayNumber);
      const today = todayISO();
      let streak=0, cursor=today;
      const byDate = new Map(days.map(d=>[d.date,d]));
      // count consecutive days ending today (or yesterday if today has no activity yet)
      for(let i=0;i<days.length+1;i++){
        const d = byDate.get(cursor);
        if(d){ const ts=state.tasks.filter(t=>t.dayId===d.id); if(ts.length && ts.every(t=>t.completed)){ streak++; cursor=addDays(cursor,-1); continue; } }
        if(i===0 && cursor===today){ cursor=addDays(cursor,-1); continue; } // allow today not done yet
        break;
      }
      return streak;
    },
    totalStudyMinutes(fn){
      const now = new Date(); const out={today:0,week:0,all:0};
      state.sessions.forEach(s=>{ if(!s.duration) return; out.all+=s.duration;
        const d=new Date(s.startedAt);
        if(isoDate(d)===todayISO()) out.today+=s.duration;
        if((now-d) < 7*86400000) out.week+=s.duration; });
      return out;
    }
  };
})();
</script>

<script id="commands" type="application/javascript">
/* ============================ COMMANDS (validated mutations) ============================ */
const UndoRegistry = new Map();

const Cmd = (() => {
  const S = () => Store.s;

  function subjectIdByName(name){
    const clean = String(name||"").trim();
    if(!clean) return null;
    let s = S().subjects.find(x=>x.name.toLowerCase()===clean.toLowerCase());
    if(s) return s.id;
    s = { id:uid("sub"), name:clean };
    S().subjects.push(s);
    DB.put("subjects",s);
    return s.id;
  }

  async function createRoutine({ name, startDate, duration, days, makePrimary=true }){
    name = String(name||"Untitled Routine").trim().slice(0,80) || "Untitled Routine";
    duration = clamp(parseInt(duration,10)||30, 1, 1000);
    startDate = startDate || todayISO();
    const rid = uid("rt");
    const routine = { id:rid, name, startDate, duration, status:"active", isPrimary:false, createdAt:Date.now(), updatedAt:Date.now() };
    const newDays=[], newTasks=[];
    for(let i=0;i<duration;i++){
      newDays.push({ id:uid("day"), routineId:rid, dayNumber:i+1, date:addDays(startDate,i), status:"pending" });
    }
    (days||[]).forEach((d,i)=>{
      if(!d || !newDays[i]) return;
      (d.subjects||[]).forEach((sub,si)=>{
        const sid = subjectIdByName(sub.name);
        (sub.topics||[]).forEach((topic,ti)=>{
          newTasks.push({ id:uid("task"), dayId:newDays[i].id, subjectId:sid, title:String(topic).trim()||"Untitled",
            completed:false, completedAt:null, estimatedMinutes:0, note:"", createdAt:Date.now(), updatedAt:Date.now(), sortOrder:si*1000+ti });
        });
      });
    });
    await DB.txn(["routines","days","tasks","subjects"], "readwrite", async t=>{
      if(makePrimary){ for(const r of S().routines){ if(r.isPrimary){ r.isPrimary=false; r.updatedAt=Date.now(); await t.put("routines",r); } } routine.isPrimary=true; }
      await t.put("routines",routine);
      for(const d of newDays) await t.put("days",d);
      for(const x of newTasks) await t.put("tasks",x);
    });
    S().routines.push(routine); S().days.push(...newDays); S().tasks.push(...newTasks);
    if(routine.isPrimary && S().settings.primaryRoutineId!==rid) await Store.saveSettings({ primaryRoutineId:rid });
    Store.emit();
    return routine;
  }

  async function updateRoutine(id, patch){
    const r = Store.routine(id); if(!r) throw new Error("Routine not found");
    Object.assign(r, patch, { updatedAt:Date.now() });
    if(patch.startDate!==undefined || patch.duration!==undefined){
      const existing = Store.daysOf(id);
      const maxExisting = existing.length ? Math.max(...existing.map(d=>d.dayNumber)) : 0;
      const target = clamp(parseInt(r.duration,10)||maxExisting||1, 1, 1000);
      r.duration = target;
      const byNum = new Map(existing.map(d=>[d.dayNumber,d]));
      await DB.txn(["routines","days"], "readwrite", async t=>{
        await t.put("routines",r);
        for(let n=1;n<=target;n++){
          let d = byNum.get(n);
          if(d){ const nd = addDays(r.startDate,n-1); if(d.date!==nd){ d.date=nd; await t.put("days",d); } }
          else { const nd={ id:uid("day"), routineId:id, dayNumber:n, date:addDays(r.startDate,n-1), status:"pending" };
                 await t.put("days",nd); S().days.push(nd); }
        }
        for(let n=target+1;n<=maxExisting;n++){ const d=byNum.get(n); if(d){ await t.del("days",d.id);
          S().days = S().days.filter(x=>x.id!==d.id); } }
      });
    } else { await DB.put("routines",r); }
    Store.emit();
    return r;
  }

  async function deleteRoutine(id){
    const days = Store.daysOf(id); const ids = new Set(days.map(d=>d.id));
    await DB.txn(["routines","days","tasks"], "readwrite", async t=>{
      await t.del("routines",id);
      for(const d of days) await t.del("days",d.id);
      for(const task of S().tasks.filter(x=>ids.has(x.dayId))) await t.del("tasks",task.id);
    });
    S().routines = S().routines.filter(r=>r.id!==id);
    S().days = S().days.filter(d=>d.routineId!==id);
    S().tasks = S().tasks.filter(x=>!ids.has(x.dayId));
    if(S().settings.primaryRoutineId===id){ const next=S().routines[0]||null; await setPrimary(next?next.id:null); }
    Store.emit();
  }

  async function setPrimary(id){
    S().routines.forEach(r=>{ r.isPrimary = r.id===id; r.updatedAt=Date.now(); });
    await DB.txn(["routines"],"readwrite", async t=>{ for(const r of S().routines) await t.put("routines",r); });
    await Store.saveSettings({ primaryRoutineId:id });
  }

  async function createTask({ dayId, subjectId, subjectName, title, estimatedMinutes=0, note="" }){
    const day = Store.day(dayId); if(!day) throw new Error("Day not found");
    const sid = subjectId || subjectIdByName(subjectName);
    title = String(title||"").trim(); if(!title) throw new Error("Task title required");
    const list = Store.tasksOf(dayId);
    const task = { id:uid("task"), dayId, subjectId:sid, title:title.slice(0,300), completed:false, completedAt:null,
      estimatedMinutes:parseInt(estimatedMinutes,10)||0, note:String(note||"").slice(0,1000), createdAt:Date.now(), updatedAt:Date.now(),
      sortOrder: list.length? list[list.length-1].sortOrder+1 : 0 };
    await DB.put("tasks",task); S().tasks.push(task); await refreshDayStatus(dayId); Store.emit();
    return task;
  }

  async function updateTask(id, patch){
    const t = S().tasks.find(x=>x.id===id); if(!t) throw new Error("Task not found");
    ["title","estimatedMinutes","note","sortOrder","dayId"].forEach(k=>{ if(patch[k]!==undefined) t[k]=patch[k]; });
    if(patch.subjectId!==undefined) t.subjectId = patch.subjectId;
    if(patch.subjectName!==undefined) t.subjectId = subjectIdByName(patch.subjectName);
    t.updatedAt = Date.now();
    await DB.put("tasks",t); await refreshDayStatus(t.dayId); Store.emit(); return t;
  }

  async function setTaskComplete(id, done, opts={}){
    const t = S().tasks.find(x=>x.id===id); if(!t) return null;
    const prevCompleted = t.completed, prevAt = t.completedAt;
    t.completed = !!done; t.completedAt = done ? Date.now() : null; t.updatedAt=Date.now();
    await DB.put("tasks",t); await refreshDayStatus(t.dayId);
    if(!opts.silent) await pushAIChange({ description:(done?"Completed task: ":"Reopened task: ")+t.title, scope:"task",
      undo:async()=>{ const x=S().tasks.find(z=>z.id===id); if(x){ x.completed=prevCompleted; x.completedAt=prevAt; x.updatedAt=Date.now(); await DB.put("tasks",x); await refreshDayStatus(x.dayId); Store.emit(); } } });
    Store.emit(); return t;
  }

  async function deleteTask(id){
    const t = S().tasks.find(x=>x.id===id); if(!t) return;
    const dayId = t.dayId;
    await DB.del("tasks",id); S().tasks = S().tasks.filter(x=>x.id!==id);
    await refreshDayStatus(dayId); Store.emit();
  }

  async function duplicateTask(id){
    const t = S().tasks.find(x=>x.id===id); if(!t) return null;
    const list = Store.tasksOf(t.dayId);
    const copy = { ...t, id:uid("task"), completed:false, completedAt:null,
      createdAt:Date.now(), updatedAt:Date.now(), sortOrder:(list[list.length-1]?.sortOrder||0)+1 };
    await DB.put("tasks",copy); S().tasks.push(copy); await refreshDayStatus(t.dayId); Store.emit(); return copy;
  }

  async function moveTask(id, targetDayId, opts={ copy:false }){
    const t = S().tasks.find(x=>x.id===id); if(!t) return null;
    const from = t.dayId;
    const list = Store.tasksOf(targetDayId);
    if(opts.copy){
      const copy = { ...t, id:uid("task"), dayId:targetDayId, completed:false, completedAt:null,
        createdAt:Date.now(), updatedAt:Date.now(), sortOrder:(list[list.length-1]?.sortOrder||0)+1 };
      await DB.put("tasks",copy); S().tasks.push(copy); await refreshDayStatus(targetDayId);
    } else {
      t.dayId = targetDayId; t.updatedAt=Date.now();
      await DB.put("tasks",t); await refreshDayStatus(targetDayId); if(from!==targetDayId) await refreshDayStatus(from);
    }
    Store.emit(); return t;
  }

  async function duplicateDay(dayId, targetDayId){
    const tasks = Store.tasksOf(dayId);
    for(const t of tasks) await moveTask(t.id, targetDayId, { copy:true });
  }

  async function refreshDayStatus(dayId){
    const d = Store.day(dayId); if(!d) return;
    const ts = S().tasks.filter(t=>t.dayId===dayId);
    const status = (ts.length>0 && ts.every(t=>t.completed)) ? "complete" : (ts.length>0? "active":"pending");
    if(d.status!==status){ d.status=status; await DB.put("days",d); }
  }

  async function bulkCreateTasks(dayId, subjectName, titles){
    for(const title of titles) await createTask({ dayId, subjectName, title });
  }

  async function createNote({ title="", content="" }={}){
    const note = { id:uid("note"), title:String(title).slice(0,120), content:String(content), tags:[], createdAt:Date.now(), updatedAt:Date.now() };
    await DB.put("notes",note); S().notes.push(note); Store.emit(); return note;
  }
  async function updateNote(id,patch){ const n=S().notes.find(x=>x.id===id); if(!n) return; Object.assign(n,patch,{updatedAt:Date.now()}); await DB.put("notes",n); Store.emit(); return n; }
  async function deleteNote(id){ await DB.del("notes",id); S().notes=S().notes.filter(n=>n.id!==id); Store.emit(); }

  async function saveSession(session){ await DB.put("sessions",session); S().sessions.push(session); Store.emit(); return session; }

  async function pushAIChange(rec){
    const change = { id:uid("chg"), description:rec.description||"Change", scope:rec.scope||"app",
      previousState:rec.previousState||null, newState:rec.newState||null, createdAt:Date.now(), revertedAt:null };
    UndoRegistry.set(change.id, rec.undo||null);
    await DB.put("aichanges",change); S().aichanges.unshift(change); Store.emit(); return change;
  }

  function exportPayload(){
    return { app:"InflowMap", version:IM.version, schemaVersion:IM.schemaVersion, exportedAt:new Date().toISOString(),
      settings:{ theme:S().settings.theme, primaryRoutineId:S().settings.primaryRoutineId, ai:{ provider:S().settings.ai.provider, model:S().settings.ai.model } },
      routines:S().routines, days:S().days, subjects:S().subjects, tasks:S().tasks, notes:S().notes,
      sessions:S().sessions, templates:S().templates };
  }
  function validatePayload(p){
    const problems=[];
    if(!p || typeof p!=="object") return { ok:false, problems:["File is not valid JSON data."] };
    if(p.app!=="InflowMap") problems.push("This file was not created by InflowMap.");
    if(p.schemaVersion && p.schemaVersion>IM.schemaVersion) problems.push("This backup was made with a newer version of InflowMap.");
    ["routines","days","subjects","tasks"].forEach(k=>{ if(p[k] && !Array.isArray(p[k])) problems.push('Field "'+k+'" is malformed.'); });
    return { ok:problems.length===0, problems };
  }
  function summarize(p){
    return { routines:(p.routines||[]).length, days:(p.days||[]).length, tasks:(p.tasks||[]).length,
      notes:(p.notes||[]).length, sessions:(p.sessions||[]).length, templates:(p.templates||[]).length };
  }
  async function importPayload(p, mode="merge"){
    const valid = validatePayload(p); if(!valid.ok) throw new Error(valid.problems.join(" "));
    if(mode==="replace"){
      await DB.txn(["routines","days","subjects","tasks","notes","sessions","templates"],"readwrite", async t=>{
        for(const s of ["routines","days","subjects","tasks","notes","sessions","templates"]) await t.clear(s);
      });
      S().routines=[]; S().days=[]; S().subjects=[]; S().tasks=[]; S().notes=[]; S().sessions=[]; S().templates=[];
    }
    const added={routines:0,tasks:0,notes:0,sessions:0};
    const hasRoutine=id=>!!Store.routine(id), hasDay=id=>!!Store.day(id),
      hasSub=id=>S().subjects.some(x=>x.id===id), hasTask=id=>S().tasks.some(x=>x.id===id),
      hasNote=id=>S().notes.some(x=>x.id===id), hasSes=id=>S().sessions.some(x=>x.id===id),
      hasTpl=id=>S().templates.some(x=>x.id===id);
    const rmap=new Map(), dmap=new Map(), smap=new Map(), tmap=new Map();
    for(const s of (p.subjects||[])){ const it={...s}; if(hasSub(it.id)) it.id=uid("sub"); smap.set(s.id,it.id); await DB.put("subjects",it); if(!S().subjects.some(x=>x.id===it.id)) S().subjects.push(it); }
    for(const r of (p.routines||[])){ const it={...r,isPrimary:false}; if(hasRoutine(it.id)) it.id=uid("rt"); rmap.set(r.id,it.id); await DB.put("routines",it); S().routines.push(it); added.routines++; }
    for(const d of (p.days||[])){ const it={...d}; if(hasDay(it.id)) it.id=uid("day"); if(rmap.has(it.routineId)) it.routineId=rmap.get(it.routineId); dmap.set(d.id,it.id); await DB.put("days",it); S().days.push(it); }
    for(const t of (p.tasks||[])){ const it={...t}; if(hasTask(it.id)) it.id=uid("task"); if(dmap.has(it.dayId)) it.dayId=dmap.get(it.dayId); if(smap.has(it.subjectId)) it.subjectId=smap.get(it.subjectId); await DB.put("tasks",it); S().tasks.push(it); added.tasks++; }
    for(const n of (p.notes||[])){ const it={...n}; if(hasNote(it.id)) it.id=uid("note"); await DB.put("notes",it); S().notes.push(it); added.notes++; }
    for(const s of (p.sessions||[])){ const it={...s}; if(hasSes(it.id)) it.id=uid("ses"); if(tmap.has(it.taskId)) it.taskId=tmap.get(it.taskId); await DB.put("sessions",it); S().sessions.push(it); added.sessions++; }
    for(const tp of (p.templates||[])){ const it={...tp}; if(hasTpl(it.id)) it.id=uid("tpl"); await DB.put("templates",it); S().templates.push(it); }
    Store.emit(); return added;
  }

  async function clearAll(){
    await DB.txn(["routines","days","subjects","tasks","notes","sessions","templates","aichanges"],"readwrite", async t=>{
      for(const s of ["routines","days","subjects","tasks","notes","sessions","templates","aichanges"]) await t.clear(s);
    });
    S().routines=[]; S().days=[]; S().subjects=[]; S().tasks=[]; S().notes=[]; S().sessions=[]; S().templates=[]; S().aichanges=[];
    await Store.saveSettings({ primaryRoutineId:null }); Store.emit();
  }

  async function saveAsTemplate(routineId, name){
    const r = Store.routine(routineId); if(!r) throw new Error("Routine not found");
    const days = Store.daysOf(routineId).map(d=>({ dayNumber:d.dayNumber,
      tasks: Store.tasksOf(d.id).map(t=>({ subject:Store.subjectName(t.subjectId), title:t.title, estimatedMinutes:t.estimatedMinutes||0 })) }));
    const tpl = { id:uid("tpl"), name:(name||r.name).slice(0,80), data:{ duration:r.duration, days }, createdAt:Date.now() };
    await DB.put("templates",tpl); S().templates.push(tpl); Store.emit(); return tpl;
  }
  async function createFromTemplate(templateId, { name, startDate }){
    const tpl = S().templates.find(t=>t.id===templateId); if(!tpl) throw new Error("Template not found");
    const days = [];
    (tpl.data.days||[]).forEach(d=>{
      const groups = new Map();
      (d.tasks||[]).forEach(t=>{ if(!groups.has(t.subject)) groups.set(t.subject,[]); groups.get(t.subject).push(t.title); });
      days[d.dayNumber-1] = { subjects:Array.from(groups.entries()).map(([n,topics])=>({ name:n, topics })) };
    });
    return createRoutine({ name:name||tpl.name+" (copy)", startDate:startDate||todayISO(), duration:tpl.data.duration, days });
  }
  async function deleteTemplate(id){ await DB.del("templates",id); S().templates=S().templates.filter(t=>t.id!==id); Store.emit(); }

  return { subjectIdByName, createRoutine, updateRoutine, deleteRoutine, setPrimary, createTask, updateTask,
    setTaskComplete, deleteTask, duplicateTask, moveTask, duplicateDay, refreshDayStatus, bulkCreateTasks,
    createNote, updateNote, deleteNote, saveSession, pushAIChange, exportPayload, validatePayload, summarize,
    importPayload, clearAll, saveAsTemplate, createFromTemplate, deleteTemplate };
})();

/* ============================ BULK TEXT PARSER ============================ */
function parseBulkPlan(text){
  const lines = String(text||"").split(/\r?\n/);
  const days = []; let cur = null;
  const bn = "০১২৩৪৫৬৭৮৯";
  const toNum = s => parseInt(String(s).replace(/[০-৯]/g,c=>bn.indexOf(c)),10);
  const dayRe = /^\s*(?:day|din|দিন|d)\s*([0-9০-৯]+)\s*[:\-]?\s*$/i;
  for(const raw of lines){
    const line = raw.trim(); if(!line) continue;
    const dm = line.match(dayRe);
    if(dm){ const n=toNum(dm[1]); while(days.length<n) days.push({subjects:[]}); cur=days[n-1]; continue; }
    const m = line.match(/^(.+?)\s*[:\-–]\s*(.+)$/);
    if(m){
      if(!cur){ cur={subjects:[]}; days.push(cur); }
      const subject=m[1].trim();
      const topics=m[2].split(/[,،;|]/).map(x=>x.trim()).filter(Boolean);
      cur.subjects.push({ name:subject, topics: topics.length?topics:[m[2].trim()] });
      continue;
    }
    if(cur && cur.subjects.length){ cur.subjects[cur.subjects.length-1].topics.push(line); }
    else { if(!cur){ cur={subjects:[]}; days.push(cur); } cur.subjects.push({ name:"General", topics:[line] }); }
  }
  // A bare first line often is a subject heading ("বাংলা") followed by its topics.
  days.forEach(d=>{
    if(d.subjects.length===1 && d.subjects[0].name==="General" && d.subjects[0].topics.length>=2 && d.subjects[0].topics[0].length<=24){
      const head = d.subjects[0].topics[0];
      if(!/[:\-–]/.test(head)){ d.subjects[0].name = head.trim(); d.subjects[0].topics.shift(); }
    }
  });
  return days;
}
</script>

<script id="ui-shell" type="application/javascript">
/* ============================ UI: shell, theme, toast, sheets ============================ */
function applyTheme(mode){
  const m = mode==="system" ? (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light") : mode;
  document.documentElement.setAttribute("data-theme", m==="dark"?"dark":"light");
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", m==="dark" ? "#0d0f14" : "#f6f7f9");
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>{ applyTheme(Store.s.settings.theme); });

function toast(msg, ms=2200){
  const el = document.createElement("div"); el.className="toast"; el.textContent=msg;
  $("#toasts").appendChild(el);
  setTimeout(()=>{ el.style.transition="opacity .2s"; el.style.opacity="0"; setTimeout(()=>el.remove(),200); }, ms);
}

const Layers = {
  stack:[],
  _savedY:0,
  open(html, opts={}){
    if(this.stack.length===0){
      this._savedY = window.scrollY;
      document.body.style.top = (-this._savedY)+"px";
      document.body.classList.add("sheet-open");
    }
    const scrim = document.createElement("div"); scrim.className="scrim";
    const layer = document.createElement("div"); layer.className="layer";
    layer.innerHTML = html;
    scrim.onclick = ()=>{ if(opts.dismissable!==false) Layers.close(); };
    $("#layers").appendChild(scrim); $("#layers").appendChild(layer);
    this.stack.push({ scrim, layer, onClose:opts.onClose });
    if(opts.initialFocus) setTimeout(()=>{ const f=$("#layers "+opts.initialFocus); f&&f.focus(); },60);
    return layer;
  },
  close(){
    const item = this.stack.pop(); if(!item) return;
    item.scrim.remove(); item.layer.remove();
    if(item.onClose) try{item.onClose();}catch(e){}
    if(this.stack.length===0){
      document.body.classList.remove("sheet-open");
      document.body.style.top = "";
      window.scrollTo(0, this._savedY);
    }
  },
  closeAll(){ while(this.stack.length) this.close(); }
};
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && Layers.stack.length) Layers.close(); });

/* stability: block pinch-zoom + double-tap zoom (desktop trackpads and touch) */
document.addEventListener("wheel", e=>{ if(e.ctrlKey) e.preventDefault(); }, { passive:false });
document.addEventListener("gesturestart", e=>e.preventDefault());
document.addEventListener("gesturechange", e=>e.preventDefault());
let _lastTouchEnd = 0;
document.addEventListener("touchend", e=>{
  const now = Date.now();
  if(now - _lastTouchEnd <= 320) e.preventDefault();
  _lastTouchEnd = now;
}, { passive:false });
/* keep the visual viewport from being shifted by focus/keyboard on mobile */
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", ()=>{
    if(window.visualViewport.scale !== 1) window.scrollTo(0, window.scrollY);
  });
}

function sheet(title, bodyHtml, opts={}){
  const html = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-grab" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 style="margin:0;font-size:16px;font-weight:650;flex:1">${esc(title)}</h2>
      <button class="btn btn-icon" data-close aria-label="Close">${icon("x",undefined,20)}</button>
    </div>
    <div class="sheet-body">${bodyHtml}</div>
  </div>`;
  const layer = Layers.open(html, opts);
  layer.querySelector("[data-close]").onclick = ()=>Layers.close();
  return layer;
}

function confirmDialog({ title, message, confirmText="Confirm", danger=false, onConfirm }){
  const layer = sheet(title, `
    <p class="muted" style="margin:0 0 20px">${esc(message)}</p>
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost" style="flex:1" data-cancel>Cancel</button>
      <button class="btn ${danger?"btn-danger":"btn-primary"}" style="flex:1" data-ok>${esc(confirmText)}</button>
    </div>`);
  layer.querySelector("[data-cancel]").onclick = ()=>Layers.close();
  layer.querySelector("[data-ok]").onclick = async ()=>{ try{ await onConfirm(); } finally { Layers.close(); } };
}

<script id="ai-layer" type="application/javascript">
/* ============================ AI: provider adapter layer ============================ */
const AIProviders = {
  gemini:{
    name:"Google Gemini",
    keyHint:"Starts with AIza, ~39 characters.",
    keyPattern:/^AIza[0-9A-Za-z_\-]{10,}$/,
    docs:"https://aistudio.google.com/apikey",
    models:["gemini-3.6-flash","gemini-3.5-flash","gemini-3.5-flash-lite","gemini-3.7-flash","gemini-3.8-flash"],
    defaultModel:"gemini-3.6-flash",
    endpoint(model,key){ return `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`; },
    headers(){ return { "Content-Type":"application/json" }; },
    buildBody({ system, contents, toolDeclarations }){
      const body = { contents, systemInstruction:{ parts:[{ text:system }] },
        generationConfig:{ temperature:0.35, maxOutputTokens:2048 } };
      if(toolDeclarations) body.tools = [{ functionDeclarations:toolDeclarations }];
      return body;
    },
    parse(resp){
      const cand = resp?.candidates?.[0]; const parts = cand?.content?.parts||[];
      const text = parts.filter(p=>p.text).map(p=>p.text).join("").trim();
      const calls = parts.filter(p=>p.functionCall).map(p=>({ name:p.functionCall.name, args:p.functionCall.args||{} }));
      return { text, calls, raw:resp };
    }
  },

  /* Groq & Mistral (and any OpenAI-compatible endpoint) share this adapter */
  openai:{
    name:"OpenAI-compatible",
    endpoint(model,key,baseUrl){ return (baseUrl||this.baseUrl).replace(/\/+$/,"")+"/chat/completions"; },
    headers(key){ return { "Content-Type":"application/json", "Authorization":"Bearer "+key }; },
    buildBody({ messages, system, toolDeclarations, model }){
      const msgs = [{ role:"system", content:system }, ...messages.map(m=>({ role:m.role, content:m.content }))];
      const body = { model, messages:msgs, temperature:0.35, max_tokens:2048 };
      if(toolDeclarations){
        body.tools = toolDeclarations.map(d=>({ type:"function", function:{ name:d.name, description:d.description, parameters:d.parameters } }));
      }
      return body;
    },
    parse(resp){
      const choice = resp?.choices?.[0] || {};
      const m = choice.message || {};
      const text = (m.content||"").trim();
      const calls = (m.tool_calls||[]).map(tc=>{
        let args = {};
        try{ args = typeof tc.function?.arguments==="string" ? JSON.parse(tc.function.arguments||"{}") : (tc.function?.arguments||{}); }
        catch(_){ args = {}; }
        return { name:tc.function?.name, args };
      }).filter(c=>c.name);
      return { text, calls, raw:resp };
    }
  }
};
/* concrete OpenAI-compatible providers are registered onto the shared adapter */
const OPENAI_PROVIDERS = {
  groq:{ baseUrl:"https://api.groq.com/openai/v1",
    models:["openai/gpt-oss-120b","openai/gpt-oss-20b","llama-3.3-70b-versatile","llama-3.1-8b-instant","moonshotai/kimi-k2-instruct"],
    defaultModel:"openai/gpt-oss-120b" },
  mistral:{ baseUrl:"https://api.mistral.ai/v1",
    models:["mistral-small-latest","mistral-large-latest","open-mistral-nemo","codestral-latest"],
    defaultModel:"mistral-small-latest" }
};
for(const [id,cfg] of Object.entries(OPENAI_PROVIDERS)){
  AIProviders[id] = Object.assign({}, AIProviders.openai, {
    name: id==="groq" ? "Groq" : "Mistral AI",
    keyHint:"Starts with "+(id==="groq"?"gsk_":"")+(id==="mistral"?"":id==="groq"?"":"")+"…",
    keyPattern: id==="groq" ? /^gsk_[0-9A-Za-z]{20,}$/ : /^[0-9A-Za-z_\-]{16,}$/,
    docs: id==="groq" ? "https://console.groq.com/keys" : "https://console.mistral.ai/api-keys",
    baseUrl: cfg.baseUrl,
    models: cfg.models,
    defaultModel: cfg.defaultModel,
    endpoint(model,key){ return cfg.baseUrl+"/chat/completions"; }
  });
}
AIProviders.groq.keyHint = "Starts with gsk_";
AIProviders.mistral.keyHint = "A long key from console.mistral.ai";


const AIService = {
  provider(){ return AIProviders[Store.s.settings.ai.provider] || AIProviders.gemini; },
  configured(){ return !!(Store.s.settings.ai.apiKey||"").trim(); },
  async generate({ system, messages, tools }){
    if(!navigator.onLine) throw new AIError("You're offline. AI needs an internet connection — your study data is safe and still available.");
    if(!this.configured()) throw new AIError("Add your "+this.provider().name+" API key in Settings to use AI.", "NO_KEY");
    const p = this.provider(); const cfg = Store.s.settings.ai;
    const isGemini = (cfg.provider||"gemini")==="gemini";
    const contents = messages.map(m=>({ role:m.role==="assistant"?"model":"user", parts:[{ text:m.content }] }));
    const body = p.buildBody({ system, messages, contents, toolDeclarations: tools, model: cfg.model });
    let resp, lastErr;
    for(let attempt=0; attempt<2; attempt++){
      try{
        const r = await fetch(p.endpoint(cfg.model,cfg.apiKey), { method:"POST", headers:p.headers(cfg.apiKey),
          body:JSON.stringify(body) });
        if(!r.ok){ const detail = await r.text().catch(()=> "");
          if(r.status===400||r.status===401) throw new AIError("Your "+p.name+" API key was rejected. Open Settings and press “Test connection”.", "AUTH", detail);
          if(r.status===403) throw new AIError(p.name+" refused this key. Check the key's permissions or billing.", "FORBIDDEN", detail);
          if(r.status===404) throw new AIError("The selected model isn't available for this key. Pick another model in AI configuration.", "MODEL", detail);
          if(r.status===429) throw new AIError(p.name+"'s free quota for this key is used up right now. Please try again later.", "QUOTA", detail);
          lastErr = new AIError(p.name+" is temporarily unavailable. Your local study data is still safe.", "HTTP"+r.status, detail); 
          await new Promise(res=>setTimeout(res,700*(attempt+1))); continue; }
        resp = await r.json(); break;
      }catch(e){ if(e instanceof AIError && (e.code==="AUTH"||e.code==="FORBIDDEN"||e.code==="MODEL"||e.code==="QUOTA")) throw e; lastErr = e; await new Promise(res=>setTimeout(res,700)); }
    }
    if(!resp) throw lastErr || new AIError(p.name+" is temporarily unavailable. Your local study data is still safe.");
    return p.parse(resp);
  },
  /* stream not required; single-shot with retry is used */
  async testKey(key, model){
    if(!navigator.onLine) return { ok:false, message:"You're offline. Connect to the internet and try again." };
    const k = (key||"").trim();
    if(!k) return { ok:false, message:"Enter your API key first." };
    const p = this.provider();
    const isGemini = (Store.s.settings.ai.provider||"gemini")==="gemini";
    const testBody = isGemini
      ? JSON.stringify({ contents:[{ role:"user", parts:[{ text:"ping" }] }], generationConfig:{ maxOutputTokens:8 } })
      : JSON.stringify({ model:model, messages:[{ role:"user", content:"ping" }], max_tokens:8 });
    try{
      const r = await fetch(p.endpoint(model||Store.s.settings.ai.model, k), {
        method:"POST", headers:p.headers(k), body:testBody
      });
      if(r.ok) return { ok:true, model:model };
      let reason = "";
      try{ const j = await r.json(); reason = j?.error?.message || j?.message || ""; }catch(_){}
      if(r.status===400) return { ok:false, message:p.name+" rejected the key. "+(reason||"It may be incorrect or copied incompletely.") };
      if(r.status===401) return { ok:false, message:"Unauthorized — the key is wrong or missing. Check it on the provider's console." };
      if(r.status===403) return { ok:false, message:"This key isn't allowed to use the API. Check permissions or billing." };
      if(r.status===404) return { ok:false, message:"The model '"+model+"' isn't available for this key. Try a different model." };
      if(r.status===429) return { ok:false, message:"The key works, but the free quota is used up right now. Try again later." };
      return { ok:false, message:p.name+" returned error "+r.status+". "+(reason||"") };
    }catch(e){ return { ok:false, message:"Could not reach "+p.name+". Check your internet connection." }; }
  }
};
class AIError extends Error{ constructor(msg,code,detail){ super(msg); this.code=code||"AI"; this.detail=detail||""; } }

/* ============================ AI: tool layer (validated actions) ============================ */
const AITools = {
  declarations(){ return [
    fn("getContext","Return a compact snapshot of routines, current day and progress.", {}),
    fn("getDay","Get a day and its tasks by day number.", { dayNumber:{type:"integer"}, routineId:{type:"string"} }),
    fn("searchApp","Search tasks, days and notes.", { query:{type:"string"} }),
    fn("getProgress","Progress stats for a routine.", { routineId:{type:"string"} }),
    fn("getStudySessions","Recent study sessions.", { limit:{type:"integer"} }),
    fn("createRoutine","Create a complete new routine.", { name:{type:"string"}, duration:{type:"integer"}, startDate:{type:"string"}, plan:{type:"array",items:{type:"object"}} }),
    fn("createTask","Add a task to a day.", { dayNumber:{type:"integer"}, subject:{type:"string"}, title:{type:"string"} }),
    fn("updateTask","Edit an existing task by its id.", { taskId:{type:"string"}, title:{type:"string"}, subject:{type:"string"} }),
    fn("deleteTask","Delete a task by id.", { taskId:{type:"string"} }),
    fn("moveTask","Move a task to another day number.", { taskId:{type:"string"}, targetDayNumber:{type:"integer"} }),
    fn("duplicateTask","Duplicate a task by id.", { taskId:{type:"string"} }),
    fn("completeTask","Mark a task complete or incomplete.", { taskId:{type:"string"}, completed:{type:"boolean"} }),
    fn("createNote","Create a note.", { title:{type:"string"}, content:{type:"string"} })
  ]; },
  /* Read-only tools execute immediately. Mutating tools are staged, validated, and require approval. */
  async execute(name, args, ctx){
    const r = ctx.routine || Store.primaryRoutine();
    switch(name){
      case "getContext": return AIAgent.contextSnapshot();
      case "getDay": { const d = dayNum(r,args.dayNumber); return d? { dayNumber:d.dayNumber, date:d.date, tasks:Store.tasksOf(d.id).map(slim) } : { error:"Day not found" }; }
      case "searchApp": return searchAll(args.query||"").slice(0,25);
      case "getProgress": return Store.statsFor((r||{}).id) || {};
      case "getStudySessions": return [...Store.s.sessions].sort((a,b)=>b.startedAt-a.startedAt).slice(0,args.limit||10).map(s=>({ duration:s.duration, startedAt:s.startedAt, task:s.taskId }));
      default: throw new AIError("Unknown tool: "+name);
    }
  }
};
function fn(name,description,properties){
  return { name, description, parameters:{ type:"object", properties, required:Object.keys(properties) } };
}
function slim(t){ return { id:t.id, title:t.title, subject:Store.subjectName(t.subjectId), completed:t.completed, estimatedMinutes:t.estimatedMinutes||0 }; }
function dayNum(r,n){ if(!r) return null; n=parseInt(n,10); if(!n) return null; return Store.dayOfNumber(r.id,n); }
function searchAll(q){
  q=(q||"").toLowerCase(); if(!q) return [];
  const out=[];
  Store.s.tasks.forEach(t=>{ if(t.title.toLowerCase().includes(q)){ const d=Store.day(t.dayId);
    out.push({ type:"task", taskId:t.id, dayNumber:d?d.dayNumber:null, date:d?d.date:null, title:t.title, subject:Store.subjectName(t.subjectId) }); } });
  Store.s.notes.forEach(n=>{ if((n.title+" "+n.content).toLowerCase().includes(q)) out.push({ type:"note", noteId:n.id, title:n.title||"Untitled" }); });
  return out;
}

<script id="ai-agent" type="application/javascript">
/* ============================ AI AGENT (proposal → diff → approval → commit) ============================ */
const AIAgent = {
  busy:false,
  lastError:null,
  pending:null, // staged proposal awaiting approval

  contextSnapshot(){
    const r = Store.primaryRoutine();
    if(!r) return { routines:[], note:"No routine yet." };
    const today = todayISO();
    const curIdx = clamp(daysBetween(r.startDate,today)+1,1,r.duration);
    const day = Store.dayOfNumber(r.id,curIdx);
    const tasks = day?Store.tasksOf(day.id):[];
    const st = Store.statsFor(r.id);
    return {
      routine:{ id:r.id, name:r.name, startDate:r.startDate, duration:r.duration, currentDay:curIdx },
      today:{ dayNumber:curIdx, date:today, tasks:tasks.map(slim), done:tasks.filter(t=>t.completed).length, total:tasks.length },
      progress:{ completedDays:st.doneDays, totalDays:st.totalDays, doneTasks:st.doneTasks, totalTasks:st.totalTasks, pct:st.pct },
      subjects: Store.subjectStats(r.id).map(s=>({ name:s.name, pct:s.pct, total:s.total })),
      routines: Store.s.routines.map(x=>({ id:x.id, name:x.name, duration:x.duration, status:x.status, primary:x.isPrimary })),
      notesCount: Store.s.notes.length,
      sessionsRecent: Store.s.sessions.slice(-5).map(s=>({ minutes:s.duration, taskId:s.taskId }))
    };
  },

  systemPrompt(){
    return `You are the InflowMap planning agent — an action-taking assistant inside a personal study planner.
You help the user plan, restructure and analyse their study routine. Understand Bengali, English and mixed commands.

TODAY'S DATE: ${todayISO()}

RULES:
- Resolve references like "এই দিন", "today", "এই task" using the CONTEXT block.
- Never invent task ids. If you need ids, first call getDay / searchApp.
- To CHANGE the plan, return a JSON object in a fenced block \`\`\`json ... \`\`\` of the form:
  { "summary": "short description", "actions": [ { "action":"move_task", "taskId":"...", "targetDayNumber": 26 } ] }
- If no change is needed, answer normally in prose, without a JSON block.
- Keep prose short. All changes are shown to the user as a diff and applied only after approval.

BUILDING A COMPLETE ROUTINE (the user is asking you to create a study plan from scratch):
- This is your strongest capability. When the user wants a new plan, you may EITHER ask a few clarifying
  questions first (preferred when goal/subjects/duration are unclear) OR, if you already have enough
  (goal, subjects, number of days), generate the plan immediately.
- Ask at most 3 short questions, only about things you truly need: exam/goal, subjects to cover,
  duration in days, start date, daily study time, and whether they want spaced revision. Do not over-ask.
- If a ROUTINE INTERVIEW block is present, all required fields are already collected. Do not ask another
  question; generate the complete plan immediately.
- Bengali question example: "কোন exam-এর জন্য? কোন কোন subject? কত দিনের plan চাই?"
- When generating, produce ONE action:
  { "action":"create_routine", "name":"...", "duration": 90, "startDate":"YYYY-MM-DD",
    "plan": [ { "subjects":[ { "name":"বাংলা", "topics":["সন্ধি","সমাস"] }, { "name":"English","topics":["Tense"] } ] }, ... ] }
- "plan" MUST be an array whose length equals "duration": one entry per day, in order (day 1 first).
- Every day entry has a "subjects" array; every subject has a "name" and a "topics" array of concrete topics.
- Use real, specific topics appropriate to the goal (e.g. "সমাস", "Tense", "মুক্তিযুদ্ধ", "Algebra") — never placeholders.
- Build a realistic progression: cover the syllabus across the days, leave lighter/revision days, and put
  revision of earlier material on later days rather than repeating a fixed list every day.
- Keep subjects consistent in naming so progress tracking groups them correctly.
- duration must be between 1 and 1000. startDate defaults to today (${todayISO()}) if unspecified.
- Never ask the user to paste JSON. You produce the plan; the app shows it as a preview for approval.`;
  },

  async send(userText, options={}){
    this.lastError=null;
    const ctx = this.contextSnapshot();
    const r = Store.primaryRoutine();
    const focusedDay = Store.s.ui.focusDayId ? Store.day(Store.s.ui.focusDayId) : null;
    const focusTask = Store.s.ui.editingTaskId ? Store.s.tasks.find(t=>t.id===Store.s.ui.editingTaskId) : null;
    const contextBlock = `CONTEXT:\n${JSON.stringify(ctx)}\n` +
      (focusedDay? `USER IS VIEWING: Day ${focusedDay.dayNumber} (${focusedDay.date})\n`:"") +
      (focusTask? `USER SELECTED TASK: ${focusTask.id} "${focusTask.title}"\n`:"") +
      (Store.s.ui.aiContext? `SCREEN CONTEXT: ${Store.s.ui.aiContext}\n`:"") +
      (options.routineDraft ? `ROUTINE INTERVIEW (already collected; do not ask more questions):\n${JSON.stringify(options.routineDraft)}\n`:"");

    // prior turns
    const history = (Store.s.ui.aiMessages||[]).slice(-8).map(m=>({ role:m.role, content:m.content }));
    const messages = [ { role:"user", content: contextBlock + "\nUSER REQUEST:\n" + userText } ];
    // fold history before the request for continuity
    const conversation = [...history.slice(0,-1).filter(h=>!h.pending), ...messages]; // don't feed pending previews

    const replies = [];
    let proposal = null;
    let turns = 0;
    let workingMessages = conversation;
    while(turns++ < 4){
      const out = await AIService.generate({ system:this.systemPrompt(), messages:workingMessages, tools:AITools.declarations() });
      if(out.calls && out.calls.length){
        const results = [];
        for(const c of out.calls){
          try{ results.push({ name:c.name, result: await AITools.execute(c.name,c.args,{ routine:r }) }); }
          catch(e){ results.push({ name:c.name, error:e.message }); }
        }
        workingMessages = [...workingMessages, { role:"assistant", content:(out.text||"")+"\n[called: "+out.calls.map(c=>c.name).join(", ")+"]" },
          { role:"user", content:"TOOL RESULTS:\n"+JSON.stringify(results) }];
        continue;
      }
      if(out.text) replies.push(out.text);
      // extract proposal
      proposal = extractProposal(out.text);
      break;
    }
    const text = replies.join("\n\n").replace(/```json[\s\S]*?```/g,"").trim() || (proposal? "I prepared changes for your approval." : "");
    return { text, proposal };
  },

  /* Validate + stage actions; returns rich preview. Does NOT mutate. */
  async stage(actions, summary){
    const r = Store.primaryRoutine();
    const ops = [];
    const problems = [];
    for(const a of actions||[]){
      try{ ops.push(validateAction(a, r)); }
      catch(e){ problems.push({ action:a, error:e.message }); }
    }
    if(!ops.length) throw new AIError("The proposed change was invalid and was not applied." + (problems.length? " ("+problems[0].error+")" : ""));
    this.pending = { ops, problems, summary: summary||"Plan change", createdAt:Date.now() };
    return this.pending;
  },

  async apply(){
    if(!this.pending) throw new AIError("Nothing to apply.");
    const { ops } = this.pending;
    const snapshot = JSON.parse(JSON.stringify({ tasks:Store.s.tasks, days:Store.s.days, routines:Store.s.routines }));
    const applied = [];
    try{
      for(const op of ops){ await runOp(op); applied.push(op); }
    }catch(e){
      await restoreSnapshot(snapshot);
      this.pending = null;
      throw new AIError("A change failed and nothing was applied. Original state restored.");
    }
    await Cmd.pushAIChange({ description: this.pending.summary, scope:"ai",
      previousState:{ taskCount:snapshot.tasks.length, dayCount:snapshot.days.length, routineCount:snapshot.routines.length },
      newState:{ taskCount:Store.s.tasks.length, dayCount:Store.s.days.length, routineCount:Store.s.routines.length },
      undo: async ()=>{ await restoreSnapshot(snapshot); Store.emit(); toast("Change undone"); } });
    this.pending = null;
    Store.emit();
    return applied.length;
  },

  reject(){ this.pending=null; }
};

/* --- action validation (never trust raw AI arguments) --- */
function validateAction(a, r){
  const act = String(a.action||"").trim();
  const int = v => { const n = parseInt(v,10); if(!Number.isFinite(n)) throw new Error("Invalid number"); return n; };
  const taskExists = id => Store.s.tasks.some(t=>t.id===id);
  switch(act){
    case "move_task": case "copy_task": {
      if(!taskExists(a.taskId)) throw new Error("Task not found: "+a.taskId);
      const d = dayNum(r, int(a.targetDayNumber)); if(!d) throw new Error("Target day not found");
      return { act, taskId:a.taskId, targetDayId:d.id, label:`${act==="move_task"?"Move":"Copy"} "${Store.s.tasks.find(t=>t.id===a.taskId).title}" → Day ${d.dayNumber}`, from:Store.day(Store.s.tasks.find(t=>t.id===a.taskId).dayId), to:d };
    }
    case "delete_task": {
      if(!taskExists(a.taskId)) throw new Error("Task not found");
      const t=Store.s.tasks.find(x=>x.id===a.taskId);
      return { act, taskId:a.taskId, label:`Delete "${t.title}"`, from:Store.day(t.dayId) };
    }
    case "duplicate_task": {
      if(!taskExists(a.taskId)) throw new Error("Task not found");
      const t=Store.s.tasks.find(x=>x.id===a.taskId);
      return { act, taskId:a.taskId, label:`Duplicate "${t.title}"`, from:Store.day(t.dayId) };
    }
    case "update_task": {
      if(!taskExists(a.taskId)) throw new Error("Task not found");
      return { act, taskId:a.taskId, patch:{ title:a.title, subjectName:a.subject }, label:`Edit "${Store.s.tasks.find(t=>t.id===a.taskId).title}"`, from:Store.day(Store.s.tasks.find(t=>t.id===a.taskId).dayId) };
    }
    case "complete_task": {
      if(!taskExists(a.taskId)) throw new Error("Task not found");
      const t=Store.s.tasks.find(x=>x.id===a.taskId);
      return { act, taskId:a.taskId, completed:!!a.completed, label:`${a.completed?"Complete":"Reopen"} "${t.title}"`, from:Store.day(t.dayId) };
    }
    case "create_task": {
      const d = dayNum(r, int(a.dayNumber)); if(!d) throw new Error("Day not found");
      const title = String(a.title||"").trim(); if(!title) throw new Error("Task needs a title");
      return { act, dayId:d.id, subject:String(a.subject||"General"), title, label:`Add "${title}" (${a.subject||"General"}) to Day ${d.dayNumber}`, to:d };
    }
    case "create_note": {
      return { act, title:String(a.title||"Note").slice(0,120), content:String(a.content||""), label:`Create note "${a.title||"Note"}"` };
    }
    case "create_routine": {
      const name = String(a.name||"New Routine").trim().slice(0,80) || "New Routine";
      const duration = clamp(int(a.duration)||30,1,1000);
      let startDate = a.startDate||todayISO();
      if(!/^\d{4}-\d{2}-\d{2}$/.test(startDate)) startDate = todayISO();
      const rawPlan = Array.isArray(a.plan) ? a.plan : [];
      if(!rawPlan.length) throw new Error("The plan had no days.");
      // normalise each day -> { subjects:[{name, topics:[...]}] }, dropping empties
      const plan = [];
      for(let i=0;i<Math.min(duration, rawPlan.length);i++){
        const d = rawPlan[i] || {};
        const subs = Array.isArray(d.subjects) ? d.subjects : [];
        const subjects = subs.map(s=>({
          name: String(s?.name||"General").trim().slice(0,60) || "General",
          topics: (Array.isArray(s?.topics)? s.topics : []).map(t=>String(t).trim()).filter(Boolean).slice(0,40)
        })).filter(s=>s.topics.length);
        plan.push({ subjects });
      }
      while(plan.length < duration) plan.push({ subjects:[] });
      const taskCount = plan.reduce((a,d)=>a+d.subjects.reduce((b,s)=>b+s.topics.length,0),0);
      if(taskCount===0) throw new Error("The plan had no tasks to create.");
      const activeDays = plan.filter(d=>d.subjects.length).length;
      return { act, name, duration, startDate, plan, taskCount, activeDays,
        label:`Create routine "${name}"`, summary:`${duration} days · ${taskCount} tasks across ${activeDays} day(s) · starts ${fmtDate(startDate)}` };
    }
    default: throw new Error("Unsupported action: "+act);
  }
}

async function runOp(op){
  switch(op.act){
    case "move_task": return Cmd.moveTask(op.taskId, op.targetDayId, { copy:false });
    case "copy_task": return Cmd.moveTask(op.taskId, op.targetDayId, { copy:true });
    case "delete_task": return Cmd.deleteTask(op.taskId);
    case "duplicate_task": return Cmd.duplicateTask(op.taskId);
    case "update_task": return Cmd.updateTask(op.taskId, op.patch);
    case "complete_task": return Cmd.setTaskComplete(op.taskId, op.completed, { silent:true });
    case "create_task": return Cmd.createTask({ dayId:op.dayId, subjectName:op.subject, title:op.title });
    case "create_note": return Cmd.createNote({ title:op.title, content:op.content });
    case "create_routine": { const plan = op.plan.map(d=>d && d.subjects ? d : { subjects:[] }); return Cmd.createRoutine({ name:op.name, startDate:op.startDate, duration:op.duration, days:plan }); }
    default: throw new Error("Unsupported action");
  }
}

async function restoreSnapshot(snap){
  // full restore of mutated stores
  await DB.txn(["tasks","days","routines"],"readwrite", async t=>{
    await t.clear("tasks"); await t.clear("days"); await t.clear("routines");
    for(const x of snap.tasks) await t.put("tasks",x);
    for(const x of snap.days) await t.put("days",x);
    for(const x of snap.routines) await t.put("routines",x);
  });
  Store.s.tasks = snap.tasks; Store.s.days = snap.days; Store.s.routines = snap.routines;
}

function extractProposal(text){
  if(!text) return null;
  const m = text.match(/```json\s*([\s\S]*?)```/i);
  if(!m) return null;
  try{ const j = JSON.parse(m[1]);
    if(j && Array.isArray(j.actions)) return { summary:j.summary||"Plan change", actions:j.actions };
  }catch(e){ console.warn("Malformed AI proposal", e); }
  return null;
}

function proposalDiffHtml(pending){
  const r = Store.primaryRoutine();
  return pending.ops.map(op=>{
    if(op.act==="create_routine"){
      const days = op.plan.filter(d=>d.subjects.length);
      const previewCount = Math.min(days.length, 5);
      const shown = days.slice(0, previewCount).map((d,i)=>{
        const idx = op.plan.indexOf(d)+1;
        const subs = d.subjects.map(s=>`<div style="margin-top:4px"><b>${esc(s.name)}</b> · ${s.topics.map(t=>esc(t)).join(", ")}</div>`).join("");
        return `<div style="margin-top:8px;padding-left:8px;border-left:2px solid var(--success)">
          <div style="font-size:11px;font-weight:700;color:var(--text-2)">DAY ${String(idx).padStart(2,"0")}</div>${subs}</div>`;
      }).join("");
      const more = days.length > previewCount ? `<div class="muted2" style="font-size:12px;margin-top:8px">+ ${days.length-previewCount} more day(s)…</div>` : "";
      return `<div class="diff-add" style="margin-bottom:8px">
        <div style="font-weight:650;font-size:13px">+ ${esc(op.label)}</div>
        <div style="font-size:12.5px;margin-top:2px">${esc(op.summary||"")}</div>
        ${shown}${more}</div>`;
    }
    if(op.act==="create_task" || op.act==="copy_task" || op.act==="duplicate_task"){
      return `<div class="diff-add" style="margin-bottom:8px"><div style="font-weight:650;font-size:13px">+ ${esc(op.label)}</div></div>`;
    }
    if(op.act==="delete_task"){
      return `<div class="diff-del" style="margin-bottom:8px"><div style="font-weight:650;font-size:13px">− ${esc(op.label)}${op.from?` (was Day ${op.from.dayNumber})`:""}</div></div>`;
    }
    if(op.act==="update_task" || op.act==="complete_task"){
      return `<div class="diff-mod" style="margin-bottom:8px"><div style="font-weight:650;font-size:13px">~ ${esc(op.label)}${op.from?` · Day ${op.from.dayNumber}`:""}</div></div>`;
    }
    if(op.act==="move_task"){
      return `<div class="diff-mod" style="margin-bottom:8px"><div style="font-weight:650;font-size:13px">→ ${esc(op.label)}</div>
        <div class="muted2" style="font-size:12px">Day ${op.from?op.from.dayNumber:"?"} → Day ${op.to.dayNumber}</div></div>`;
    }
    return "";
  }).join("");
}
</script>

function msgBubble(m){
  if(m.role==="user") return `<div style="display:flex;justify-content:flex-end;margin-bottom:10px">
    <div style="background:var(--primary);color:var(--primary-contrast);padding:10px 14px;border-radius:var(--r-lg);border-bottom-right-radius:6px;max-width:85%;font-size:14px;white-space:pre-wrap" class="bn">${esc(m.content)}</div></div>`;

      ${m.pending.diffHtml}
      ${m.pending.problems&&m.pending.problems.length?`<div class="diff-del" style="margin-top:6px;font-size:12px">${esc(m.pending.problems.length)} action(s) could not be validated and were skipped.</div>`:""}
      <div style="display:flex;gap:8px;margin-top:12px">
