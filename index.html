function renderAIScreenScroll(){ const sc=$("#ai-scroll"); if(sc) sc.scrollTop = sc.scrollHeight; }

const AI_QUICK_PROMPTS = {
  "new-routine":"I want you to build a complete new study routine for me. Ask me only what you need (goal, subjects, duration), then generate the full plan.",
  "bulk-routine":"Help me structure a routine from a pasted plan."
};

function openAIConfig(prefillContext){
  const ai = Store.s.settings.ai;
  const p = AIProviders[ai.provider] || AIProviders.groq;
  const inList = (p.models||[]).includes(ai.model);
  const layer = sheet("AI configuration", `
    <p class="muted" style="margin:0 0 14px;font-size:13px">InflowMap uses your own AI provider key. It is stored only on this device and sent straight to the provider — never to us.</p>
    <label class="label" for="ai-provider">Provider</label>
    <select class="input" id="ai-provider" style="margin-bottom:4px">
      ${Object.entries(AIProviders).map(([id,pr])=>`<option value="${id}" ${ai.provider===id?"selected":""}>${esc(pr.name)}</option>`).join("")}
    </select>
    <p class="muted2" style="font-size:12px;margin:0 0 14px" id="ai-hint">${esc(p.keyHint||"")} · <a href="${p.docs}" target="_blank" rel="noopener">get a key</a></p>
    <label class="label" for="ai-key">API key</label>
    <input class="input" id="ai-key" type="password" placeholder="paste key" value="${esc(ai.apiKey)}" autocomplete="off" spellcheck="false" style="margin-bottom:14px">
    <label class="label" for="ai-model">Model</label>
    <select class="input" id="ai-model" style="margin-bottom:8px">
      ${(p.models||[]).map(m=>`<option value="${m}" ${ai.model===m?"selected":""}>${m}</option>`).join("")}
      <option value="__custom" ${!inList?"selected":""}>Custom…</option>
    </select>
    <input class="input" id="ai-model-custom" placeholder="custom model id" value="${inList?"":esc(ai.model)}" style="margin-bottom:16px;${inList?"display:none":""}">
    <div id="ai-status" style="display:none;padding:10px 12px;border-radius:var(--r-md);font-size:13px;margin-bottom:14px"></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" id="ai-test" style="flex:1">Test connection</button>
      <button class="btn btn-primary" id="ai-save" style="flex:1">Save</button>
    </div>
    <details style="margin-top:14px">
      <summary class="muted" style="font-size:12.5px;cursor:pointer">Key not working? Common causes</summary>
      <ul class="muted2" style="font-size:12.5px;line-height:1.7;margin:8px 0 0;padding-left:20px">
        <li>The key was not saved yet — press <b>Save</b> after pasting.</li>
        <li>The key is incomplete or has extra spaces.</li>
        <li>The key belongs to a different provider than the one selected above.</li>
        <li>The model name is not available for this key — try another model.</li>
        <li>Free-tier quota exhausted (usually resets after 24h).</li>
      </ul>
    </details>`);
  const keyEl = layer.querySelector("#ai-key"), modelEl = layer.querySelector("#ai-model");
  const customEl = layer.querySelector("#ai-model-custom");
  const provEl = layer.querySelector("#ai-provider"), hintEl = layer.querySelector("#ai-hint");
  const statusEl = layer.querySelector("#ai-status");
  const showStatus = (kind,msg)=>{ statusEl.style.display="block";
    statusEl.style.background = kind==="ok"?"var(--success-soft)":kind==="warn"?"var(--warn-soft)":"var(--danger-soft)";
    statusEl.style.color = kind==="ok"?"var(--success)":kind==="warn"?"var(--warn)":"var(--danger)";
    statusEl.textContent = msg; };

  provEl.onchange = ()=>{ const np = AIProviders[provEl.value]||AIProviders.groq;
    hintEl.innerHTML = esc(np.keyHint||"")+' · <a href="'+np.docs+'" target="_blank" rel="noopener">get a key</a>';
    modelEl.innerHTML = np.models.map(m=>`<option value="${m}">${m}</option>`).join("") + '<option value="__custom">Custom…</option>';
    modelEl.value = np.defaultModel; customEl.style.display="none"; customEl.value=""; keyEl.value="";
    showStatus("warn","Switched to "+np.name+". Paste that provider's key."); };
  modelEl.onchange = ()=>{ const custom = modelEl.value==="__custom";
    customEl.style.display = custom?"block":"none"; if(custom) customEl.focus(); };

  const chosenModel = ()=> modelEl.value==="__custom" ? (customEl.value.trim()||Store.s.settings.ai.model) : modelEl.value;

  layer.querySelector("#ai-test").onclick = async ()=>{
    const key = keyEl.value.trim();
    if(!key){ showStatus("bad","Enter your API key first."); return; }
    // persist provider+key first so the service tests the right endpoint
    await Store.saveSettings({ ai:{ provider:provEl.value, apiKey:key, model:chosenModel() } });
    showStatus("warn","Testing…");
    const res = await AIService.testKey(key, chosenModel());
    if(res.ok) showStatus("ok","Working — the key is valid ("+res.model+").");

  };
  layer.querySelector("#ai-save").onclick = async ()=>{
    const key = keyEl.value.trim();
    if(!key){ showStatus("bad","Enter your API key first."); return; }
    const np = AIProviders[provEl.value]||AIProviders.groq;
    if(np.keyPattern && !np.keyPattern.test(key)) showStatus("warn","That doesn't look like a "+np.name+" key. Saving anyway — use Test connection to check.");
    await Store.saveSettings({ ai:{ provider:provEl.value, apiKey:key, model:chosenModel() } });
    toast("AI settings saved"); render();
    if(prefillContext) pushAI(prefillContext);
  };
}

/* conversation flow */
const ROUTINE_SUBJECT_ALIASES = [
  ["বাংলা", ["বাংলা", "bangla", "bengali"]], ["English", ["english", "ইংরেজি"]],
  ["Math", ["math", "গণিত", "mathematics"]], ["GK", ["gk", "general knowledge", "সাধারণ জ্ঞান"]],
  ["Science", ["science", "বিজ্ঞান"]], ["ICT", ["ict", "আইসিটি"]], ["Physics", ["physics", "পদার্থবিজ্ঞান"]],
  ["Chemistry", ["chemistry", "রসায়ন", "রসায়ন"]], ["Biology", ["biology", "জীববিজ্ঞান"]]
];
function bengaliDigits(text){
  return String(text||"").replace(/[০-৯]/g, d=>"০১২৩৪৫৬৭৮৯".indexOf(d));
}
function isGreeting(text){ return /^(হাই|হ্যালো|hello|hi|hey|ভাই|bhai)[\s!.?।]*$/iu.test(String(text||"").trim()); }
function hasRoutineIntent(text){ return /(routine|study plan|plan|রুটিন|প্ল্যান|পরিকল্পনা|পড়ার সময়সূচি|পড়ার সময়সূচি)/iu.test(String(text||"")); }
function routineSubjects(text){
  const t=String(text||"").toLowerCase();
  return ROUTINE_SUBJECT_ALIASES.filter(([,aliases])=>aliases.some(a=>t.includes(a.toLowerCase()))).map(([name])=>name);
}
function cleanRoutineGoal(text){
  return String(text||"").replace(/[০-৯\d]+\s*(?:দিন|days?|day)/giu, " ")
    .replace(/(?:আমার জন্য|please|আমাকে|একটা|একটি|বানাও|বনাও|create|make|build|routine|study plan|plan|রুটিন|প্ল্যান|পরিকল্পনা)/giu, " ")
    .replace(/[—–,:;|]+/g," ").replace(/\s+/g," ").trim().replace(/^(?:এর জন্য|for)\s+/iu,"");
}
function updateRoutineDraft(text, draft){
  const raw=String(text||"").trim(), t=bengaliDigits(raw);
  const duration=t.match(/(\d{1,4})\s*(?:দিন|days?|day)/iu);
  if(duration) draft.duration=clamp(parseInt(duration[1],10),1,1000);
  const found=routineSubjects(raw);
  draft.subjects=[...new Set([...(draft.subjects||[]), ...found])];
  const explicit=t.match(/(?:goal|exam|target|লক্ষ্য|পরীক্ষা)\s*[:：-]?\s*(.+)$/iu);
  let goal=explicit?.[1] || "";
  if(!goal && /(admission|ভর্তি|bcs|job|চাকরি|hsc|ssc|ielts|toefl|exam|পরীক্ষা)/iu.test(raw)) goal=raw;
  if(!goal && draft.active && !found.length && !duration && !hasRoutineIntent(raw) && raw.length>2) goal=raw;
  goal=cleanRoutineGoal(goal);
  if(goal) draft.goal=goal.slice(0,120);
  return draft;
}
function routineQuestion(d){
  if(!d.goal) return "ঠিক আছে। কোন exam বা লক্ষ্য সামনে রেখে routine বানাব? যেমন: admission, BCS, HSC বা IELTS.";
  if(!d.subjects?.length) return "কোন কোন subject পড়বে? কমা দিয়ে লিখতে পারো, যেমন: বাংলা, English, GK, Math.";
  if(!d.duration) return "কত দিনের routine চাই? যেমন: ৩০ দিন বা ৯০ দিন.";
  return "";
}
function routineInterview(text){
  const s=Store.s, existing=s.ui.aiRoutineDraft;
  if(!existing && isGreeting(text)) return { reply:"হাই! আমি তোমার জন্য study routine বানাতে পারি। শুরু করতে exam/goal, subject আর কত দিনের plan চাই তা বলো।" };
  if(existing && existing.goal && existing.subjects?.length && existing.duration &&
     !hasRoutineIntent(text) && !routineSubjects(text).length &&
     !/(?:retry|আবার|পুনরায়|পুনরায়|generate|বানাও|create)/iu.test(text) &&
     !/\d+\s*(?:দিন|days?|day)/iu.test(bengaliDigits(text))) return null;
  if(!existing && !hasRoutineIntent(text) && !routineSubjects(text).length) return null;
  const draft=existing || { active:true, goal:"", subjects:[], duration:null, startDate:todayISO() };
  updateRoutineDraft(text,draft);
  s.ui.aiRoutineDraft=draft;
  const question=routineQuestion(draft);
  if(question) return { reply:question };
  return { draft, generate:true };
}
function finishAIRequest(request, options={}){
  AIAgent.busy=true; Store.emit();
  AIAgent.send(request,options).then(async ({ text:reply, proposal })=>{
    const msg = { role:"assistant", content: reply || "Done." };
    if(proposal){
      try{
        const pending = await AIAgent.stage(proposal.actions, proposal.summary);
        msg.pending = { diffHtml: proposalDiffHtml(pending), problems: pending.problems, summary: pending.summary };
        msg.content = (reply || "").trim() || "Here's what I suggest changing:";
        if(options.routineDraft && proposal.actions.some(a=>a.action==="create_routine")) Store.s.ui.aiRoutineDraft=null;
      }catch(e){ msg.content = (reply||"") + "\n\n" + e.message; }
    }
    Store.s.ui.aiMessages.push(msg);
    AIAgent.busy=false; Store.emit(); setTimeout(renderAIScreenScroll, 50);
  }).catch(err=>{
    Store.s.ui.aiMessages.push({ role:"assistant", content: err.message || "AI is temporarily unavailable. Your local study data is still safe." });
    AIAgent.busy=false; Store.emit(); setTimeout(renderAIScreenScroll,50);
  });
}
function pushAI(text){
  const s = Store.s;
  if(!s.ui.aiMessages) s.ui.aiMessages = [];
  s.ui.aiMessages.push({ role:"user", content:text });
  const interview=routineInterview(text);
  if(interview){
    if(interview.generate){
      finishAIRequest("Generate the complete routine now. Do not ask any more questions. Return exactly one fenced JSON proposal with one create_routine action.", { routineDraft:interview.draft });
    }else{
      s.ui.aiMessages.push({ role:"assistant", content:interview.reply });
      Store.emit(); setTimeout(renderAIScreenScroll,50);
    }
    return;
  }
  finishAIRequest(text);
}
</script>

<script id="router" type="application/javascript">
/* ============================ ROUTER + SHELL RENDER ============================ */
let CURRENT_SCREEN = "home";
const SCREENS = { home:ScreenHome, routine:ScreenRoutine, ai:ScreenAI, progress:ScreenProgress, more:ScreenMore };

function navTo(screen, opts={}){
  if(screen==="notes"||screen==="focus"||screen==="templates"||screen==="settings"||screen==="data"||screen==="search")
    return navToSub(screen);
  CURRENT_SCREEN = screen in SCREENS ? screen : "home";
  Store.s.ui.screen = CURRENT_SCREEN;
  render();
  if(opts.scrollTop!==false) window.scrollTo({ top:0, behavior:"instant" in window ? "instant" : "auto" });
}
function navToSub(sub){
  Store.s.ui.subscreen = sub;
  render();
  window.scrollTo({ top:0 });
}

function navBar(){
  const items = [["home","Home"],["routine","Routine"],["ai","AI"],["progress","Progress"],["more","More"]];
  return `<nav class="nav" role="navigation" aria-label="Primary"><div class="nav-inner">
    ${items.map(([id,label])=>`<button class="nav-btn ${CURRENT_SCREEN===id?"active":""}" data-tab="${id}"
      aria-current="${CURRENT_SCREEN===id?"page":"false"}" aria-label="${label}">${icon(id,undefined,22)}<span>${label}</span></button>`).join("")}
  </div></nav>`;
}

function render(){
  const sub = Store.s.ui.subscreen;
  let html;
  if(sub){
    html = ({ notes:ScreenNotes, focus:ScreenFocus, templates:ScreenTemplates, settings:ScreenSettings,
              data:ScreenData, search:ScreenSearch }[sub] || ScreenMore)();
    html = wrapSub(html);
  } else {
    html = (SCREENS[CURRENT_SCREEN]||ScreenHome)();
  }
  $("#app").innerHTML = html + navBar();
  afterRender();
}

function wrapSub(inner){
  return `<div class="screen" style="padding:0 16px 24px">
    <header style="padding:14px 0;display:flex;align-items:center;gap:8px">
      <button class="btn btn-icon btn-ghost" data-nav="more" aria-label="Back">${icon("back",undefined,20)}</button>
      <h1 style="margin:0;font-size:19px;font-weight:700">${esc(subTitle())}</h1></header>
    <div>${inner.replace(/<\/?div class="screen"[^>]*>/g,"")}</div></div>`;
}
function subTitle(){
  const s = Store.s.ui.subscreen;
  return ({ notes:"Notes", focus:"Focus Tools", templates:"Templates", settings:"Settings", data:"Import / Export", search:"Search" }[s]||"More");
}

/* ---------- Data screen ---------- */
function ScreenData(){
  return `<div>
    <p class="muted" style="margin:0 0 16px;font-size:14px">Your data lives only on this device. Export a backup file regularly.</p>
    <button class="btn btn-primary" data-act="export-json" style="width:100%;margin-bottom:10px">${icon("download",undefined,18)} Export backup (.json)</button>
    <button class="btn btn-ghost" data-act="import-json" style="width:100%;margin-bottom:16px">${icon("upload",undefined,18)} Import backup</button>
    <div class="card" style="padding:14px">
      <div class="label">Current data</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px">
        <span class="muted">Routines</span><b>${Store.s.routines.length}</b>
        <span class="muted">Days</span><b>${Store.s.days.length}</b>
        <span class="muted">Tasks</span><b>${Store.s.tasks.length}</b>
        <span class="muted">Notes</span><b>${Store.s.notes.length}</b>
        <span class="muted">Sessions</span><b>${Store.s.sessions.length}</b>
        <span class="muted">Templates</span><b>${Store.s.templates.length}</b>
      </div>
    </div>
    <button class="btn btn-danger" data-act="clear-data" style="width:100%;margin-top:16px">Clear all data</button>
  </div>`;
}

/* ---------- Search screen ---------- */
function ScreenSearch(){
  const q = Store.s.ui.searchQuery||"";
  const results = searchAll(q);
  return `<div>
    <div style="position:relative;margin-bottom:14px">
      <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-3)">${icon("search",undefined,16)}</span>
      <input class="input" id="global-search" placeholder="Search tasks, days, notes" value="${esc(q)}" style="padding-left:38px">
    </div>
    ${q? (results.length? results.map(r=>`<button class="card" data-search-result='${esc(JSON.stringify(r))}' style="width:100%;text-align:left;padding:12px;margin-bottom:8px;display:block">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:2px">
          <span class="tag ${r.type==="task"?"t-primary":"t-soft"}">${r.type==="task"?"Day "+r.dayNumber:"Note"}</span>
          <span style="font-size:14px;font-weight:550">${esc(r.title)}</span></div>
        ${r.subject?`<div class="muted2" style="font-size:12px">${esc(r.subject)}${r.date?" · "+esc(fmtDate(r.date)):""}</div>`:""}
      </button>`).join("") : `<div class="empty"><h3>No results</h3><p>Nothing matched "${esc(q)}".</p></div>`)
      : `<p class="muted2" style="text-align:center;padding:30px;font-size:13px">Type to search across your whole plan.</p>`}
  </div>`;
}
</script>
<script id="events" type="application/javascript">
/* ============================ EVENT WIRING ============================ */
function afterRender(){
  wireNav(); wireDynamicInputs();
}
function wireNav(){
  $$("[data-tab]").forEach(b=>b.onclick=()=>{ Store.s.ui.subscreen=null; navTo(b.dataset.tab); });
  $$("[data-nav]").forEach(b=>b.onclick=()=>navToSub(b.dataset.nav));
  $$("[data-close]").forEach(b=>b.onclick=()=>Layers.close());
  wireActions($("#app"));
}
function wireActions(root){
  if(!root) return;
  root.querySelectorAll("[data-act]").forEach(el=>{ if(el.onclick) return; el.onclick = (ev)=>{ handleAction(el.dataset.act, el, ev); }; });
  root.querySelectorAll("[data-toggle]").forEach(el=>{ el.onclick = async (e)=>{ e.stopPropagation(); await animateComplete(el.dataset.toggle); }; });
  root.querySelectorAll("[data-menu]").forEach(el=>{ el.onclick = (e)=>{ e.stopPropagation(); openTaskMenu(el.dataset.menu); }; });
  root.querySelectorAll("[data-toggle-day]").forEach(el=>{ el.onclick = (e)=>{ e.stopPropagation(); const card = el.closest(".day-card"); toggleDayCard(card); }; });
  root.querySelectorAll("[data-goto-day]").forEach(el=>{ el.onclick = ()=>{ const d = Store.dayOfNumber(Store.primaryRoutine().id, parseInt(el.dataset.gotoDay,10)); if(d) focusDay(d); }; });
  root.querySelectorAll("[data-add-to-day]").forEach(el=>{ el.onclick = (e)=>{ e.stopPropagation(); openTaskEditor(null, el.dataset.addToDay); }; });
  root.querySelectorAll("[data-rview]").forEach(el=>{ el.onclick = ()=>{ Store.s.ui.routineView=el.dataset.rview; Store.s.ui.windowAnchor=null; Store.emit(); }; });
  root.querySelectorAll("[data-window]").forEach(el=>{ el.onclick = ()=>{
      const r = Store.primaryRoutine(); const days=Store.daysOf(r.id);
      const cur = Store.s.ui.windowAnchor || clamp(daysBetween(r.startDate,todayISO())+1,1,r.duration);
      Store.s.ui.windowAnchor = clamp(cur + (el.dataset.window==="down"? 32 : -32), 1, r.duration);
      render(); setTimeout(()=>window.scrollTo({top:0}), 20);
    }; });
  root.querySelectorAll("[data-theme-set]").forEach(el=>{ el.onclick = async ()=>{ await Store.saveSettings({ theme:el.dataset.themeSet }); applyTheme(el.dataset.themeSet); render(); }; });
  root.querySelectorAll("[data-undo-change]").forEach(el=>{ el.onclick = ()=>undoChange(el.dataset.undoChange); });
  root.querySelectorAll("[data-open-note]").forEach(el=>{ el.onclick = ()=>{ Store.s.ui.editingNoteId=el.dataset.openNote; render(); }; });
  root.querySelectorAll("[data-cmd]").forEach(el=>{ el.onmousedown = (e)=>{ e.preventDefault(); document.execCommand(el.dataset.cmd,false,el.dataset.val||null); $("#note-body")?.focus(); }; });
  root.querySelectorAll("[data-use-template]").forEach(el=>{ el.onclick = ()=>useTemplate(el.dataset.useTemplate); });
  root.querySelectorAll("[data-del-template]").forEach(el=>{ el.onclick = async ()=>{ await Cmd.deleteTemplate(el.dataset.delTemplate); toast("Template deleted"); }; });
  root.querySelectorAll("[data-fmode]").forEach(el=>{ el.onclick = ()=>{ FocusTimer.mode=el.dataset.fmode; FocusTimer.elapsed=0; FocusTimer.running=false; render(); }; });
  root.querySelectorAll("[data-fpreset]").forEach(el=>{ el.onclick = ()=>{ FocusTimer.target=parseInt(el.dataset.fpreset,10)*60; FocusTimer.elapsed=0; FocusTimer.running=false; render(); }; });
  const ft = root.querySelector("[data-focus-toggle]"); if(ft) ft.onclick = toggleFocus;
  const fr = root.querySelector("[data-focus-reset]"); if(fr) fr.onclick = resetFocus;
  const sel = root.querySelector("#focus-task"); if(sel) sel.onchange = ()=>{ FocusTimer.taskId = sel.value||null; };
  root.querySelectorAll("[data-ai-chip]").forEach(el=>{ el.onclick = ()=>pushAI(el.dataset.aiChip); });
  root.querySelectorAll("[data-ai-apply]").forEach(el=>{ el.onclick = ()=>applyAIChange(); });
  root.querySelectorAll("[data-ai-cancel]").forEach(el=>{ el.onclick = ()=>{ AIAgent.reject(); markPendingResolved(); toast("Changes cancelled"); }; });
  const send = root.querySelector("[data-act='ai-send']"); if(send) send.onclick = submitAI;
  root.querySelectorAll("[data-search-result]").forEach(el=>{ el.onclick = ()=>{ try{ const r=JSON.parse(el.dataset.searchResult); gotoSearchResult(r); }catch(e){} }; });
  const tmpl = root.querySelector("[data-act='save-template']"); if(tmpl) tmpl.onclick = saveTemplateFlow;
  wireDragDrop(root);
}

/* drag & drop tasks between (and within) days; always has a menu/sheet alternative */
let _dragId = null;
function wireDragDrop(root){
  root.querySelectorAll(".task[draggable='true']").forEach(el=>{
    el.ondragstart = (e)=>{ _dragId = el.dataset.task; el.classList.add("dragging");
      try{ e.dataTransfer.setData("text/plain", _dragId); }catch(_){} e.dataTransfer.effectAllowed="move"; };
    el.ondragend = ()=>{ el.classList.remove("dragging"); $$(".task.drop-target").forEach(x=>x.classList.remove("drop-target")); _dragId=null; };
  });
  root.querySelectorAll(".task").forEach(el=>{
    el.ondragover = (e)=>{ if(!_dragId) return; if(el.dataset.task===_dragId) return; e.preventDefault(); el.classList.add("drop-target"); };
    el.ondragleave = ()=> el.classList.remove("drop-target");
    el.ondrop = async (e)=>{ e.preventDefault(); el.classList.remove("drop-target");
      const id = _dragId || e.dataTransfer?.getData("text/plain"); if(!id) return;
      const targetDayId = el.dataset.day;
      if(targetDayId){ await Cmd.moveTask(id, targetDayId, {copy:false}); toast("Task moved"); }
    };
  });
  // dropping onto a day card background moves to that day's end
  root.querySelectorAll("[data-day-card]").forEach(card=>{
    card.ondragover = (e)=>{ if(_dragId) e.preventDefault(); };
    card.ondrop = async (e)=>{ if(e.target.closest(".task")) return; e.preventDefault();
      const id=_dragId; if(!id) return; await Cmd.moveTask(id, card.dataset.dayCard, {copy:false}); toast("Task moved"); };
  });
}

/* debounced input listeners (bound once per render via direct listeners) */
function wireDynamicInputs(){
  const q = $("#q"); if(q) q.oninput = debounce(()=>{ Store.s.ui.searchQuery=q.value; Store.emit(); },300);
  const rs = $("#routine-search"); if(rs) rs.oninput = debounce(()=>{ Store.s.ui.searchQuery=rs.value; render(); },300);
  const ns = $("#notes-search"); if(ns) ns.oninput = debounce(()=>{ Store.s.ui.notesQuery=ns.value; render(); },250);
  const gs = $("#global-search"); if(gs) gs.oninput = debounce(()=>{ Store.s.ui.searchQuery=gs.value; render(); },250);
  const nt = $("#note-title"); if(nt) nt.oninput = debounce(()=>saveNote(),400);
  const nb = $("#note-body"); if(nb) nb.oninput = debounce(()=>saveNote(),500);
  const sp = $("#set-primary"); if(sp) sp.onchange = async ()=>{ await Cmd.setPrimary(sp.value); toast("Primary routine updated"); };
  const sk = $("#set-key"); if(sk) sk.onchange = async ()=>{ await Store.saveSettings({ ai:{ ...Store.s.settings.ai, apiKey:sk.value.trim() } }); toast("API key saved"); };
  const sm = $("#set-model"); if(sm) sm.onchange = async ()=>{
    const custom = $("#set-model-custom");
    if(sm.value==="__custom"){ custom.style.display="block"; custom.focus(); return; }
    custom.style.display="none";
    await Store.saveSettings({ ai:{ ...Store.s.settings.ai, model:sm.value } }); toast("Model saved");
  };
  const smc = $("#set-model-custom"); if(smc) smc.onchange = async ()=>{ const v=smc.value.trim(); if(v){ await Store.saveSettings({ ai:{ ...Store.s.settings.ai, model:v } }); toast("Model saved"); } };
  const spr = $("#set-provider"); if(spr) spr.onchange = async ()=>{
    const pid = spr.value; const p = AIProviders[pid]||AIProviders.groq;
    await Store.saveSettings({ ai:{ ...Store.s.settings.ai, provider:pid, model:p.defaultModel } });
    toast(p.name+" selected · now add its API key"); render();
  };
  const stest = $("#set-test"); if(stest) stest.onclick = async ()=>{
    const el = $("#set-ai-status"); const key = ($("#set-key")?.value||"").trim();
    const model = $("#set-model")?.value==="__custom" ? ($("#set-model-custom")?.value||"").trim() : $("#set-model")?.value;
    await Store.saveSettings({ ai:{ ...Store.s.settings.ai, apiKey:key, model } });
    el.style.display="block"; el.style.background="var(--warn-soft)"; el.style.color="var(--warn)"; el.textContent="Testing…";
    const res = await AIService.testKey(key, model);
    el.style.background = res.ok?"var(--success-soft)":"var(--danger-soft)";
    el.style.color = res.ok?"var(--success)":"var(--danger)";
    el.textContent = res.ok ? "Working — the key is valid." : res.message;
  };
  const ti = $("#ai-input"); if(ti){ ti.oninput = ()=>{ ti.style.height="auto"; ti.style.height=Math.min(ti.scrollHeight,120)+"px"; };
    ti.onkeydown = (e)=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); submitAI(); } }; }
}

/* ---------- actions ---------- */
async function handleAction(act, el, ev){
  switch(act){
    case "new-routine": return openRoutineCreator("manual");
    case "bulk-routine": return openRoutineCreator("bulk");
    case "ai-routine": return openRoutineCreator("ai");
    case "add-task": return openTaskEditor(null, currentFocusDayId());
    case "view-day": { const d = todayDay(); if(d){ Store.s.ui.subscreen=null; Store.s.ui.routineView="today"; navTo("routine"); Store.s.ui.focusDayId=d.id; } return; }
    case "start-focus": Store.s.ui.subscreen="focus"; render(); return;
    case "ask-ai": return navTo("ai");
    case "continue-session": return resumeSession(el.dataset.session);
    case "routine-menu": return openRoutineMenu();
    case "goto-day": return openGoToDay();
    case "goto-date": return openGoToDate();
    case "jump-today": { const d = todayDay(); if(d) focusDay(d); return; }
    case "new-note": { Store.s.ui.subscreen="notes"; Store.s.ui.editingNoteId="new"; render(); return; }
    case "close-note": { saveNote(); Store.s.ui.editingNoteId=null; render(); return; }
    case "delete-note": { const id=el.dataset.id; if(id==="new"){ Store.s.ui.editingNoteId=null; render(); return; }
      return confirmDialog({ title:"Delete note?", message:"This cannot be undone.", confirmText:"Delete", danger:true,
        onConfirm: async ()=>{ await Cmd.deleteNote(id); Store.s.ui.editingNoteId=null; render(); toast("Note deleted"); } }); }
    case "ai-config": return openAIConfig();
    case "export-json": return exportJSON();
    case "import-json": return importJSON();
    case "clear-data": return confirmDialog({ title:"Clear all data?", message:"Every routine, task, note and session will be permanently deleted from this device. Export a backup first if you need it.", confirmText:"Delete everything", danger:true,
      onConfirm: async ()=>{ await Cmd.clearAll(); toast("All data cleared"); navTo("home"); } });
  }
}

/* ---------- day & task helpers ---------- */
function currentFocusDayId(){
  const r = Store.primaryRoutine(); if(!r) return null;
  const d = Store.s.ui.focusDayId ? Store.day(Store.s.ui.focusDayId) : null;
  if(d && d.routineId===r.id) return d.id;
  return (todayDay()||{}).id || (Store.daysOf(r.id)[0]||{}).id;
}
function todayDay(){
  const r = Store.primaryRoutine(); if(!r) return null;
  const idx = clamp(daysBetween(r.startDate,todayISO())+1,1,r.duration);
  return Store.dayOfNumber(r.id,idx) || Store.daysOf(r.id)[0] || null;
}
function focusDay(day){
  Store.s.ui.focusDayId = day.id;
  Store.s.ui.windowAnchor = day.dayNumber;
  if(CURRENT_SCREEN==="routine"){ render(); }
  setTimeout(()=>{ const el=document.getElementById("day-"+day.id); if(el){ el.scrollIntoView({behavior:"smooth",block:"start"}); closeDayCardIfOpen(el,false); } }, 60);
}
function toggleDayCard(card){
  if(!card) return;
  const btn = card.querySelector("[data-toggle-day]");
  const open = btn.getAttribute("aria-expanded")==="true";
  const dayId = btn.dataset.toggleDay;
  const day = Store.day(dayId); if(!day) return;
  if(open){ card.querySelector(".day-body")?.remove(); btn.setAttribute("aria-expanded","false"); btn.innerHTML=icon("chevronR",undefined,18); }
  else {
    const body = document.createElement("div"); body.className="day-body";
    body.innerHTML = dayTasksBodyHtml(dayId,{draggable:true}) + `<button class="btn btn-ghost btn-sm" data-add-to-day="${dayId}" style="margin-top:10px">${icon("plus",undefined,15)} Add task</button>`;
    card.appendChild(body);
    btn.setAttribute("aria-expanded","true"); btn.innerHTML=icon("chevron",undefined,18);
    wireActions(card);
  }
}
function closeDayCardIfOpen(card,close){ const b=card.querySelector("[data-toggle-day]"); if(close && b && b.getAttribute("aria-expanded")==="true") toggleDayCard(card); }

async function animateComplete(taskId){
  const row = document.querySelector('[data-task="'+taskId+'"]');
  if(row) row.classList.add("completing");
  await Cmd.setTaskComplete(taskId, true);
  setTimeout(()=>{ const again=document.querySelector('[data-task="'+taskId+'"]'); if(again) again.classList.add("done"); }, 10);
}

/* ---------- task action sheet ---------- */
function openTaskMenu(taskId){
  const t = Store.s.tasks.find(x=>x.id===taskId); if(!t) return;
  const layer = sheet("Task", `
    <p style="margin:0 0 14px;font-size:15px;font-weight:600">${esc(t.title)}</p>
    <div style="display:flex;flex-direction:column">
      <button class="menu-item" data-m="toggle">${icon("check",undefined,18)} ${t.completed?"Mark incomplete":"Mark complete"}</button>
      <button class="menu-item" data-m="edit">${icon("edit",undefined,18)} Edit</button>
      <button class="menu-item" data-m="move">${icon("move",undefined,18)} Move to day…</button>
      <button class="menu-item" data-m="copy">${icon("copy",undefined,18)} Copy to day…</button>
      <button class="menu-item" data-m="dup">${icon("copy",undefined,18)} Duplicate here</button>
      <button class="menu-item" data-m="focus">${icon("timer",undefined,18)} Start focus</button>
      <button class="menu-item danger" data-m="del">${icon("trash",undefined,18)} Delete</button>
    </div>`);
  layer.querySelectorAll("[data-m]").forEach(b=>b.onclick=async ()=>{
    const m=b.dataset.m; Layers.close();
    if(m==="toggle") await Cmd.setTaskComplete(taskId, !t.completed);
    if(m==="edit") openTaskEditor(taskId, t.dayId);
    if(m==="move") openDayPicker("Move to day", async (day)=>{ await Cmd.moveTask(taskId, day.id,{copy:false}); toast("Moved to Day "+day.dayNumber); });
    if(m==="copy") openDayPicker("Copy to day", async (day)=>{ await Cmd.moveTask(taskId, day.id,{copy:true}); toast("Copied to Day "+day.dayNumber); });
    if(m==="dup"){ await Cmd.duplicateTask(taskId); toast("Duplicated"); }
    if(m==="del") confirmDialog({ title:"Delete task?", message:'"'+t.title+'" will be removed.', confirmText:"Delete", danger:true, onConfirm: async()=>{ await Cmd.deleteTask(taskId); toast("Task deleted"); } });
    if(m==="focus"){ Store.s.ui.subscreen="focus"; FocusTimer.taskId=taskId; render(); }
  });
}

/* ---------- task editor ---------- */
function openTaskEditor(taskId, dayId){
  const editing = taskId ? Store.s.tasks.find(t=>t.id===taskId) : null;
  const day = Store.day(dayId) || (editing? Store.day(editing.dayId):null);
  const subjects = Array.from(new Set(Store.s.subjects.map(s=>s.name)));
  const layer = sheet(editing?"Edit task":"Add task", `
    <label class="label" for="te-subject">Subject</label>
    <input class="input" id="te-subject" list="subj-list" placeholder="e.g. বাংলা" value="${esc(editing?Store.subjectName(editing.subjectId):"")}" style="margin-bottom:12px">
    <datalist id="subj-list">${subjects.map(s=>`<option value="${esc(s)}"></option>`).join("")}</datalist>
    <label class="label" for="te-title">Task / topic</label>
    <input class="input" id="te-title" placeholder="e.g. সন্ধি" value="${esc(editing?editing.title:"")}" style="margin-bottom:12px">
    <label class="label" for="te-min">Estimated minutes (optional)</label>
    <input class="input" id="te-min" type="number" min="0" step="5" value="${editing?(editing.estimatedMinutes||""):""}" style="margin-bottom:12px">
    <label class="label" for="te-note">Note (optional)</label>
    <textarea class="input" id="te-note" placeholder="Reference, page number…" style="margin-bottom:16px">${esc(editing?editing.note:"")}</textarea>
    ${day?`<p class="muted2" style="font-size:12px;margin:0 0 12px">Adding to Day ${day.dayNumber} · ${esc(fmtDate(day.date))}</p>`:""}
    <button class="btn btn-primary" id="te-save" style="width:100%">${editing?"Save changes":"Add task"}</button>`,
    { initialFocus:"#te-title" });
  layer.querySelector("#te-save").onclick = async ()=>{
    const subject = layer.querySelector("#te-subject").value.trim();
    const title = layer.querySelector("#te-title").value.trim();
    if(!title){ toast("Please enter a task name"); return; }
    const min = parseInt(layer.querySelector("#te-min").value,10)||0;
    const note = layer.querySelector("#te-note").value.trim();
    try{
      if(editing) await Cmd.updateTask(editing.id, { title, subjectName:subject||"General", estimatedMinutes:min, note });
      else await Cmd.createTask({ dayId:day.id, subjectName:subject||"General", title, estimatedMinutes:min, note });
      Layers.close(); toast(editing?"Task updated":"Task added");
    }catch(e){ toast(e.message||"Could not save task"); }
  };
}

/* ---------- day picker ---------- */
function openDayPicker(title, onPick){
  const r = Store.primaryRoutine();
  if(!r) return toast("Create a routine first");
  const curIdx = clamp(daysBetween(r.startDate,todayISO())+1,1,r.duration);
  const layer = sheet(title, `
    <label class="label" for="dp-day">Day number (1–${r.duration})</label>
    <input class="input" id="dp-day" type="number" min="1" max="${r.duration}" value="${curIdx}" style="margin-bottom:12px">
    <label class="label" for="dp-date">or pick a date</label>
    <input class="input" id="dp-date" type="date" style="margin-bottom:16px">
    <button class="btn btn-primary" id="dp-ok" style="width:100%">Continue</button>`);
  layer.querySelector("#dp-date").onchange = (e)=>{ const n = daysBetween(r.startDate, e.target.value)+1; if(n>=1 && n<=r.duration) layer.querySelector("#dp-day").value=n; };
  layer.querySelector("#dp-ok").onclick = ()=>{
    const n = clamp(parseInt(layer.querySelector("#dp-day").value,10)||1,1,r.duration);
    const day = Store.dayOfNumber(r.id,n); Layers.close();
    if(day) onPick(day); else toast("Day not found");
  };
}

/* ---------- go to day/date (routine nav) ---------- */
function openGoToDay(){
  openDayPicker("Go to day", day=>{ focusDay(day); toast("Jumped to Day "+day.dayNumber); });
}
function openGoToDate(){
  const r = Store.primaryRoutine();
  const layer = sheet("Go to date", `
    <label class="label" for="gd-date">Select a date</label>
    <input class="input" id="gd-date" type="date" value="${todayISO()}" style="margin-bottom:16px">
    <button class="btn btn-primary" id="gd-ok" style="width:100%">Jump</button>`);
  layer.querySelector("#gd-ok").onclick = ()=>{
    const date = layer.querySelector("#gd-date").value;
    const n = daysBetween(r.startDate,date)+1;
    Layers.close();
    if(n<1) return toast("That date is before the routine starts");
    if(n>r.duration) return toast("That date is after the routine ends");
    const day = Store.dayOfNumber(r.id,n); if(day) focusDay(day);
  };
}
</script>

<script id="flows" type="application/javascript">
/* ============================ ROUTINE CREATION FLOWS ============================ */
function openRoutineCreator(mode="manual"){
  if(mode==="bulk") return openBulkCreator();
  if(mode==="ai"){ navTo("ai"); return pushAI("I want you to build a complete new study routine for me. Ask me only what you need (goal, subjects, duration), then generate the full plan."); }
  const layer = sheet("New routine", `
    <label class="label" for="nr-name">Routine name</label>
    <input class="input" id="nr-name" placeholder="e.g. 90-Day Admission" style="margin-bottom:12px">
    <label class="label" for="nr-start">Start date</label>
    <input class="input" id="nr-start" type="date" value="${todayISO()}" style="margin-bottom:12px">
    <label class="label" for="nr-dur">Duration (days)</label>
    <input class="input" id="nr-dur" type="number" min="1" max="1000" value="90" style="margin-bottom:12px">
    <div class="scroll-x" style="margin-bottom:16px">
      ${[7,30,90,180,365].map(d=>`<button class="chip" data-preset="${d}">${d} days</button>`).join("")}
    </div>
    <button class="btn btn-primary" id="nr-create" style="width:100%">Create empty routine</button>
    <button class="btn btn-ghost" id="nr-bulk" style="width:100%;margin-top:8px">${icon("upload",undefined,16)} Paste a plan instead</button>`,
    { initialFocus:"#nr-name" });

}

    <p class="muted" style="margin:0 0 10px;font-size:13px">One day per block. Format: <code>Day 1</code> then <code>Subject: topic, topic</code>.</p>
    <textarea class="input" id="bk-text" rows="9" placeholder="Day 1
বাংলা: সন্ধি, সমাস
English: Tense, Voice
GK: মুক্তিযুদ্ধ

Day 2
বাংলা: কারক
English: Narration" style="font-family:ui-monospace,monospace;font-size:13px;margin-bottom:10px"></textarea>
    <p class="muted2" id="bk-info" style="font-size:12px;margin:0 0 14px">Nothing parsed yet.</p>
    <label class="label" for="bk-name">Routine name</label>
    <input class="input" id="bk-name" placeholder="Pasted plan" style="margin-bottom:12px">
    <label class="label" for="bk-start">Start date</label>
    <input class="input" id="bk-start" type="date" value="${todayISO()}" style="margin-bottom:16px">
    <button class="btn btn-primary" id="bk-create" style="width:100%">Create routine</button>`);
  const ta = layer.querySelector("#bk-text");
  const update = ()=>{ const days = parseBulkPlan(ta.value); const tasks = days.reduce((a,d)=>a+d.subjects.reduce((b,s)=>b+s.topics.length,0),0);
    layer.querySelector("#bk-info").textContent = days.length? `${days.length} day(s) · ${tasks} task(s) detected` : "Nothing parsed yet."; };
  ta.oninput = debounce(update,250);
  layer.querySelector("#bk-create").onclick = async ()=>{
    const days = parseBulkPlan(ta.value);
    if(!days.length) return toast("Could not detect any days");
    const name = layer.querySelector("#bk-name").value.trim() || "Pasted plan";
    const start = layer.querySelector("#bk-start").value || todayISO();
    await Cmd.createRoutine({ name, startDate:start, duration:days.length, days });
    Layers.close(); toast("Routine created"); navTo("routine");
  };
}

/* ---------- routine menu ---------- */
function openRoutineMenu(){
  const r = Store.primaryRoutine(); if(!r) return;
  const layer = sheet("Routine", `
    <p style="margin:0 0 12px;font-size:14px;font-weight:600">${esc(r.name)}</p>
    <button class="menu-item" data-m="rename">${icon("edit",undefined,18)} Rename</button>
    <button class="menu-item" data-m="start">${icon("calendar",undefined,18)} Change start date</button>
    <button class="menu-item" data-m="duration">${icon("refresh",undefined,18)} Change duration</button>
    <button class="menu-item" data-m="template">${icon("template",undefined,18)} Save as template</button>
    <button class="menu-item" data-m="switch">${icon("copy",undefined,18)} Switch routine</button>
    <button class="menu-item" data-m="new">${icon("plus",undefined,18)} New routine</button>
    <button class="menu-item danger" data-m="delete">${icon("trash",undefined,18)} Delete routine</button>`);
  layer.querySelectorAll("[data-m]").forEach(b=>b.onclick=async ()=>{
    const m=b.dataset.m; Layers.close();
    if(m==="rename") promptText("Rename routine", r.name, async v=>{ await Cmd.updateRoutine(r.id,{ name:v }); toast("Renamed"); });
    if(m==="start") promptDate("Start date", r.startDate, async v=>{ await Cmd.updateRoutine(r.id,{ startDate:v }); toast("Start date updated"); });
    if(m==="duration") promptNumber("Duration (days)", r.duration, 1, 1000, async v=>{ await Cmd.updateRoutine(r.id,{ duration:v }); toast("Duration updated"); });
    if(m==="template"){ await Cmd.saveAsTemplate(r.id, r.name); toast("Saved as template"); }
    if(m==="switch") openRoutineSwitcher();

    if(m==="delete") confirmDialog({ title:"Delete routine?", message:'"'+r.name+'" and all its tasks will be permanently deleted.', confirmText:"Delete", danger:true,
      onConfirm: async ()=>{ await Cmd.deleteRoutine(r.id); toast("Routine deleted"); navTo("home"); } });
  });
}
function promptText(title, value, cb){

}
function promptDate(title, value, cb){

function openRoutineSwitcher(){
  const routines = Store.s.routines;

    <button class="menu-item" data-rid="${r.id}">
      <span style="color:${r.isPrimary?"var(--primary)":"var(--text-3)"}">${icon(r.isPrimary?"check":"routine",undefined,18)}</span>

  layer.querySelectorAll("[data-rid]").forEach(b=>b.onclick=async ()=>{ await Cmd.setPrimary(b.dataset.rid); Layers.close(); toast("Primary routine changed"); });
  layer.querySelector("[data-new]").onclick = ()=>{ Layers.close(); openRoutineCreator("manual"); };

/* ---------- import / export ---------- */
async function exportJSON(){
  const payload = Cmd.exportPayload();
  const text = JSON.stringify(payload,null,2);
  const blob = new Blob([text],{ type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "inflowmap-backup-"+todayISO()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast("Backup exported");
}
function importJSON(){
  const input = document.createElement("input"); input.type="file"; input.accept=".json,application/json";
  input.onchange = async ()=>{
    const file = input.files[0]; if(!file) return;
    let payload;
    try{ payload = JSON.parse(await file.text()); }
    catch(e){ return setTimeout(()=>toast("This backup file could not be read."),100); }
    const valid = Cmd.validatePayload(payload);
    if(!valid.ok){ Layers.close(); return showImportError(valid.problems); }
    const s = Cmd.summarize(payload);
    const layer = sheet("Import backup", `
      <div class="card" style="padding:14px;margin-bottom:14px">
        <div style="display:grid;grid-template-columns:1fr auto;gap:6px;font-size:14px">
          <span class="muted">Routines</span><b>${s.routines}</b>
          <span class="muted">Days</span><b>${s.days}</b>
          <span class="muted">Tasks</span><b>${s.tasks}</b>
          <span class="muted">Notes</span><b>${s.notes}</b>
          <span class="muted">Sessions</span><b>${s.sessions}</b>
        </div>
      </div>
      <div class="label">How should it be applied?</div>
      <div class="scroll-x" style="margin-bottom:16px">
        <button class="chip active" data-mode="merge">Merge with existing</button>
        <button class="chip" data-mode="replace">Replace everything</button>
      </div>
      <p class="muted2" id="imp-note" style="font-size:12px;margin:0 0 16px">Merge keeps your current data and adds the backup alongside it. Duplicate items get new ids.</p>
      <button class="btn btn-primary" id="imp-ok" style="width:100%">Import</button>`);
    let mode = "merge";
    layer.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ mode=b.dataset.mode;
      layer.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("active",x===b));
      layer.querySelector("#imp-note").textContent = mode==="merge"
        ? "Merge keeps your current data and adds the backup alongside it. Duplicate items get new ids."
        : "Replace deletes everything currently stored and restores only this backup."; });
    layer.querySelector("#imp-ok").onclick = async ()=>{
      try{ const added = await Cmd.importPayload(payload, mode); Layers.close();
        toast(`Imported ${added.routines} routine(s), ${added.tasks} task(s)`); render(); }
      catch(e){ Layers.close(); showImportError([e.message]); }
    };
  };
  input.click();
}
function showImportError(problems){
  confirmDialog({ title:"Import failed", message: problems.join(" "), confirmText:"OK",
    onConfirm: async ()=>{} });
}

/* ---------- focus timer ---------- */
function toggleFocus(){
  const f = FocusTimer;
  if(f.running){
    f.running=false; cancelAnimationFrame(f.raf);
    endFocusSession(false);
    render();
  } else {
    f.running=true; f.startedAt = f.startedAt || Date.now();
    if(!f.sessionId){
      f.sessionId = uid("ses");
      Cmd.saveSession({ id:f.sessionId, taskId:f.taskId||null, startedAt:Date.now(), endedAt:null, duration:f.elapsed? Math.round(f.elapsed/60):0 });
    }
    const tick = ()=>{
      if(!f.running) return;
      const now = Date.now();
      const delta = Math.floor((now - (f._last||now))/1000); f._last = now;
      f.elapsed += delta;
      if(f.mode==="pomodoro" && f.elapsed>=f.target){ f.elapsed=f.target; f.running=false; endFocusSession(true); render(); toast("Focus session complete"); return; }
      const shown = f.mode==="stopwatch"? f.elapsed : Math.max(0,f.target-f.elapsed);
      const mm=String(Math.floor(shown/60)).padStart(2,"0"), ss=String(shown%60).padStart(2,"0");
      const display = document.querySelector("[data-focus-toggle]")?.closest(".card")?.querySelector("div");
      if(display) display.textContent = mm+":"+ss;
      if(f.mode==="pomodoro"){ const b=document.querySelector(".bar > i"); if(b) b.style.width=clamp(f.elapsed/f.target*100,0,100)+"%"; }
      f.raf = requestAnimationFrame(tick);
    };
    f._last = Date.now();
    f.raf = requestAnimationFrame(tick);
    render();
  }
}
function resetFocus(){ cancelAnimationFrame(FocusTimer.raf); Object.assign(FocusTimer,{ running:false, elapsed:0, startedAt:null, sessionId:null, _last:null }); render(); }
async function endFocusSession(complete){
  const f = FocusTimer;
  const mins = Math.round(f.elapsed/60);
  if(f.sessionId){
    const sess = Store.s.sessions.find(s=>s.id===f.sessionId);
    if(sess){ sess.endedAt = Date.now(); sess.duration = mins; await DB.put("sessions",sess); Store.emit(); }
  }
  f.sessionId = null; f.startedAt = null;
}
async function resumeSession(sessionId){
  const sess = Store.s.sessions.find(s=>s.id===sessionId); if(!sess) return;
  Store.s.ui.subscreen="focus"; FocusTimer.taskId = sess.taskId||null; FocusTimer.elapsed = (sess.duration||0)*60;
  FocusTimer.sessionId = sess.id; FocusTimer.startedAt = null; FocusTimer.running = false;
  render();
}

/* ---------- AI actions ---------- */
function submitAI(){
  const ti = $("#ai-input"); if(!ti) return;
  const text = ti.value.trim(); if(!text || AIAgent.busy) return;
  ti.value=""; ti.style.height="44px";
  pushAI(text);
  setTimeout(renderAIScreenScroll, 60);
}
async function applyAIChange(){
  try{
    const n = await AIAgent.apply();
    markPendingResolved();
    toast(n+" change(s) applied");
  }catch(e){
    toast(e.message||"Could not apply changes");
  }
}
function markPendingResolved(){
  const msgs = Store.s.ui.aiMessages||[];
  for(const m of msgs) if(m.pending) m.pending.resolved = true;
  render();
}
async function undoChange(changeId){
  const c = Store.s.aichanges.find(x=>x.id===changeId); if(!c) return;
  const undo = UndoRegistry.get(changeId);
  if(!undo) return toast("This change can no longer be undone automatically.");
  await undo();
  c.revertedAt = Date.now(); await DB.put("aichanges",c);
  toast("Change undone"); render();
}

/* ---------- search result navigation ---------- */
function gotoSearchResult(r){
  Store.s.ui.subscreen=null;
  if(r.type==="task"){ const d = Store.day(Store.s.tasks.find(t=>t.id===r.taskId)?.dayId); CURRENT_SCREEN="routine"; Store.s.ui.routineView="all";
    render(); if(d) setTimeout(()=>focusDay(d),80); }
  else if(r.type==="note"){ Store.s.ui.editingNoteId=r.noteId; Store.s.ui.subscreen="notes"; render(); }
}

/* ============================ BOOT ============================ */
(async function boot(){
  try{
    await DB.open();
    await Store.load();
  }catch(e){
    console.error(e);
    $("#app").innerHTML = `<div class="empty"><h3>Storage unavailable</h3><p>InflowMap needs a browser that allows local storage (IndexedDB).</p></div>`;
    return;
  }
  applyTheme(Store.s.settings.theme||"system");
  const params = new URLSearchParams(location.search);
  const start = params.get("screen"); if(start && SCREENS[start]) CURRENT_SCREEN=start;
  Store.subscribe(()=>{ /* re-render on state change, preserving scroll on routine edits */
    const y = window.scrollY; render(); if(CURRENT_SCREEN==="routine") window.scrollTo({top:y});
  });
  render();
  /* network state: only surface when an AI action needs it */
  addEventListener("online", ()=>toast("Back online"));
  addEventListener("offline", ()=>{ /* silent; AI explains when used */ });
})();
</script>
